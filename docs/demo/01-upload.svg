<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system, 'Inter', system-ui, 'Segoe UI', sans-serif" role="img" aria-label="Step 1: Drag and drop an HTML file into Edit-i-fact">
  <defs>
    <linearGradient id="s1FileGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#FCE7F3"/>
    </linearGradient>
    <linearGradient id="s1BrandGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="s1Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="s1FileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#FAFAFA"/>

  <!-- Step pill -->
  <rect x="28" y="28" width="92" height="26" rx="13" fill="#EEF2FF"/>
  <circle cx="44" cy="41" r="9" fill="#4F46E5"/>
  <text x="44" y="45" text-anchor="middle" font-size="11" font-weight="700" fill="white">1</text>
  <text x="60" y="45" font-size="12" font-weight="600" fill="#4F46E5" letter-spacing="0.5">UPLOAD</text>

  <!-- Drop zone -->
  <g filter="url(#s1Shadow)">
    <rect x="80" y="100" width="440" height="240" rx="16" fill="white" stroke="#4F46E5" stroke-width="2" stroke-dasharray="8 5"/>
  </g>

  <!-- File icon with brand colors -->
  <g filter="url(#s1FileShadow)" transform="translate(280, 138)">
    <rect x="0" y="0" width="44" height="58" rx="6" fill="url(#s1FileGrad)" stroke="#4F46E5" stroke-width="1.6"/>
    <path d="M30 0 v12 h14" fill="none" stroke="#4F46E5" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="22" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#4F46E5" font-family="ui-monospace, monospace">HTML</text>
    <line x1="8" y1="40" x2="36" y2="40" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
    <line x1="8" y1="46" x2="32" y2="46" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round" opacity="0.4"/>
    <line x1="8" y1="52" x2="24" y2="52" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round" opacity="0.3"/>
  </g>

  <text x="300" y="232" text-anchor="middle" font-size="17" font-weight="600" fill="#111827" letter-spacing="-0.2">Drop your .html file here</text>
  <text x="300" y="254" text-anchor="middle" font-size="13" fill="#6B7280">or click to choose a file from your computer</text>

  <!-- Sample filename chip -->
  <rect x="208" y="278" width="184" height="22" rx="11" fill="#F4F4F5" stroke="#E5E7EB"/>
  <text x="300" y="293" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#6B7280">aurora-landing.html</text>

  <!-- Privacy caption -->
  <g transform="translate(300, 368)">
    <text text-anchor="middle" font-size="12" fill="#6B7280">
      <tspan font-weight="600" fill="#4F46E5">In your browser only. </tspan>
      <tspan>Nothing leaves your machine.</tspan>
    </text>
  </g>
</svg>
