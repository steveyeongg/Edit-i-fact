<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system, 'Inter', system-ui, 'Segoe UI', sans-serif" role="img" aria-label="Step 1: Drag and drop an HTML file into Edit-i-fact">
  <defs>
    <filter id="s1Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#FAFAFA"/>

  <!-- Step number -->
  <circle cx="40" cy="40" r="14" fill="#4F46E5"/>
  <text x="40" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="white">1</text>

  <!-- Title -->
  <text x="64" y="46" font-size="15" font-weight="600" fill="#111827" letter-spacing="-0.2">Upload</text>

  <!-- Drop zone -->
  <g filter="url(#s1Shadow)">
    <rect x="80" y="100" width="440" height="240" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- File icon -->
  <g transform="translate(286, 144)">
    <rect x="0" y="0" width="44" height="56" rx="6" fill="white" stroke="#4F46E5" stroke-width="2"/>
    <path d="M30 0 v12 h14" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linejoin="round"/>
    <line x1="8" y1="28" x2="28" y2="28" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="8" y1="36" x2="36" y2="36" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="8" y1="44" x2="22" y2="44" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <text x="300" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Drop your .html file here</text>
  <text x="300" y="262" text-anchor="middle" font-size="12.5" fill="#6B7280">or click to choose a file</text>

  <text x="300" y="300" text-anchor="middle" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#9CA3AF">Q4-launch-deck.html</text>

  <!-- Caption below -->
  <text x="300" y="368" text-anchor="middle" font-size="12.5" fill="#6B7280">Reads in-browser. Nothing leaves your machine.</text>
</svg>
