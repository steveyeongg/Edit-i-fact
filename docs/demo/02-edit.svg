<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system, 'Inter', system-ui, 'Segoe UI', sans-serif" role="img" aria-label="Step 2: Edit text, shapes, icons, and images across categorised panels">
  <defs>
    <filter id="s2Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#FAFAFA"/>

  <!-- Step pill -->
  <rect x="28" y="28" width="76" height="26" rx="13" fill="#FCE7F3"/>
  <circle cx="44" cy="41" r="9" fill="#DB2777"/>
  <text x="44" y="45" text-anchor="middle" font-size="11" font-weight="700" fill="white">2</text>
  <text x="60" y="45" font-size="12" font-weight="600" fill="#DB2777" letter-spacing="0.5">EDIT</text>

  <!-- Two-pane workspace -->
  <g filter="url(#s2Shadow)">
    <rect x="32" y="80" width="536" height="262" rx="12" fill="white" stroke="#E5E7EB"/>
  </g>
  <line x1="320" y1="80" x2="320" y2="342" stroke="#E5E7EB"/>

  <!-- ─── Preview pane ─── -->
  <text x="48" y="106" font-size="9.5" font-weight="600" font-family="ui-monospace, monospace" fill="#9CA3AF" letter-spacing="0.5">PREVIEW</text>

  <!-- Mini Aurora hero -->
  <rect x="48" y="120" width="252" height="22" rx="11" fill="white" stroke="#E4E4E7"/>
  <text x="174" y="135" text-anchor="middle" font-size="9" fill="#52525B">✨  Now in public beta</text>

  <!-- Headline being edited (focused) -->
  <rect x="48" y="152" width="252" height="32" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="174" y="174" text-anchor="middle" font-size="14" font-weight="500" fill="#18181B" font-family="'Iowan Old Style', Georgia, serif">Quiet productivity for makers.</text>
  <!-- Blinking caret -->
  <line x1="289" y1="156" x2="289" y2="180" stroke="#4F46E5" stroke-width="2">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Lede placeholder -->
  <rect x="60" y="194" width="228" height="6" rx="3" fill="#E4E4E7"/>
  <rect x="80" y="204" width="188" height="6" rx="3" fill="#E4E4E7"/>

  <!-- Mini card with bg/border/icon -->
  <rect x="48" y="226" width="116" height="92" rx="10" fill="white" stroke="#E4E4E7"/>
  <!-- Feature icon (star colored gold) -->
  <rect x="60" y="238" width="22" height="22" rx="6" fill="#FEF3C7"/>
  <polygon points="71,242 73.5,247 78.5,247 74.5,250 76,255 71,252 66,255 67.5,250 63.5,247 68.5,247" fill="#D97706"/>
  <rect x="60" y="270" width="80" height="6" rx="3" fill="#18181B"/>
  <rect x="60" y="282" width="92" height="4" rx="2" fill="#A1A1AA"/>
  <rect x="60" y="290" width="68" height="4" rx="2" fill="#A1A1AA"/>

  <rect x="184" y="226" width="116" height="92" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-opacity="0.3"/>
  <rect x="196" y="238" width="22" height="22" rx="6" fill="white"/>
  <circle cx="207" cy="249" r="6" fill="none" stroke="#4F46E5" stroke-width="1.4"/>
  <circle cx="207" cy="249" r="2" fill="#4F46E5"/>
  <rect x="196" y="270" width="80" height="6" rx="3" fill="#4F46E5"/>
  <rect x="196" y="282" width="92" height="4" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="196" y="290" width="60" height="4" rx="2" fill="#4F46E5" opacity="0.5"/>

  <!-- Sync arrow toward right pane -->
  <g transform="translate(308, 168)">
    <path d="M0 0 h12" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="3 2" fill="none"/>
    <path d="M10 -4 l4 4 l-4 4" stroke="#4F46E5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ─── Side panel ─── -->
  <text x="336" y="106" font-size="9.5" font-weight="600" font-family="ui-monospace, monospace" fill="#9CA3AF" letter-spacing="0.5">EDIT</text>
  <rect x="538" y="96" width="22" height="14" rx="7" fill="#F4F4F5"/>
  <text x="549" y="106" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="#9CA3AF">12</text>

  <!-- Category: TEXT BLOCKS (active, expanded) -->
  <text x="336" y="129" font-size="9" font-weight="600" font-family="ui-monospace, monospace" fill="#6B7280" letter-spacing="0.5">▾ TEXT BLOCKS</text>
  <rect x="552" y="120" width="14" height="11" rx="5.5" fill="#F4F4F5"/>

  <!-- Active H1 row (matched with preview) -->
  <rect x="332" y="138" width="232" height="50" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-opacity="0.3"/>
  <rect x="340" y="144" width="18" height="12" rx="3" fill="#F5F3FF"/>
  <text x="349" y="153" text-anchor="middle" font-size="8" font-weight="700" fill="#7C3AED" font-family="ui-monospace, monospace">H1</text>
  <rect x="536" y="144" width="14" height="12" rx="3" fill="white" stroke="#D1D5DB"/>
  <text x="543" y="153" text-anchor="middle" font-size="7" font-weight="700" fill="#111827">A</text>
  <line x1="538" y1="155" x2="548" y2="155" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="551" y="144" width="14" height="12" rx="3" fill="#F59E0B" stroke="#D1D5DB"/>
  <rect x="340" y="162" width="222" height="22" rx="4" fill="white" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="346" y="177" font-size="10" fill="#111827">Quiet productivity for makers.</text>

  <!-- Category: SHAPES & BOXES (expanded) -->
  <text x="336" y="208" font-size="9" font-weight="600" font-family="ui-monospace, monospace" fill="#6B7280" letter-spacing="0.5">▾ SHAPES &amp; BOXES</text>
  <rect x="552" y="199" width="14" height="11" rx="5.5" fill="#F4F4F5"/>

  <!-- Shape row -->
  <rect x="332" y="216" width="232" height="62" rx="6" fill="white" stroke="#E4E4E7"/>
  <rect x="340" y="222" width="56" height="12" rx="3" fill="#FAF5FF"/>
  <text x="368" y="231" text-anchor="middle" font-size="8" font-weight="700" fill="#9333EA" font-family="ui-monospace, monospace">DIV.card</text>
  <!-- Fill -->
  <text x="340" y="248" font-size="9" fill="#6B7280">Fill</text>
  <rect x="372" y="240" width="14" height="12" rx="3" fill="#EEF2FF" stroke="#D1D5DB"/>
  <!-- Border -->
  <text x="396" y="248" font-size="9" fill="#6B7280">Border</text>
  <rect x="432" y="240" width="14" height="12" rx="3" fill="white" stroke="#D1D5DB"/>
  <!-- Radius slider -->
  <text x="340" y="268" font-size="9" fill="#6B7280">Radius</text>
  <rect x="372" y="265" width="160" height="3" rx="1.5" fill="#E5E7EB"/>
  <rect x="372" y="265" width="62" height="3" rx="1.5" fill="#4F46E5"/>
  <circle cx="434" cy="266.5" r="4" fill="#4F46E5"/>
  <text x="546" y="269" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#9CA3AF">12px</text>

  <!-- ICONS (collapsed) -->
  <text x="336" y="298" font-size="9" font-weight="600" font-family="ui-monospace, monospace" fill="#6B7280" letter-spacing="0.5">▸ ICONS</text>
  <rect x="552" y="289" width="14" height="11" rx="5.5" fill="#F4F4F5"/>

  <!-- IMAGES (collapsed) -->
  <text x="336" y="318" font-size="9" font-weight="600" font-family="ui-monospace, monospace" fill="#6B7280" letter-spacing="0.5">▸ IMAGES</text>
  <rect x="552" y="309" width="14" height="11" rx="5.5" fill="#F4F4F5"/>

  <!-- Caption -->
  <text x="300" y="372" text-anchor="middle" font-size="12" fill="#6B7280">Text · shapes · icons · images — each in its own collapsible category.</text>
</svg>
