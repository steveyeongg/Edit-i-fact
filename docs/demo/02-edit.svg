<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system, 'Inter', system-ui, 'Segoe UI', sans-serif" role="img" aria-label="Step 2: Click any text in the preview to edit it inline">
  <defs>
    <filter id="s2Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#FAFAFA"/>

  <!-- Step number -->
  <circle cx="40" cy="40" r="14" fill="#4F46E5"/>
  <text x="40" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="white">2</text>
  <text x="64" y="46" font-size="15" font-weight="600" fill="#111827" letter-spacing="-0.2">Click. Type. Done.</text>

  <!-- Two-pane mini -->
  <g filter="url(#s2Shadow)">
    <rect x="40" y="80" width="520" height="260" rx="12" fill="white" stroke="#E5E7EB"/>
  </g>
  <line x1="370" y1="80" x2="370" y2="340" stroke="#E5E7EB"/>

  <!-- Preview pane content -->
  <text x="60" y="120" font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="0.5">PREVIEW</text>

  <!-- Headline being edited -->
  <rect x="60" y="138" width="290" height="44" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="68" y="167" font-size="18" font-weight="600" fill="#111827" letter-spacing="-0.6">Calmer focus, every day.</text>
  <!-- Caret -->
  <line x1="340" y1="148" x2="340" y2="174" stroke="#4F46E5" stroke-width="2">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </line>

  <text x="60" y="208" font-size="11.5" fill="#6B7280">A quiet focus companion that ends</text>
  <text x="60" y="226" font-size="11.5" fill="#6B7280">the noise of notification stacks.</text>

  <rect x="60" y="252" width="124" height="30" rx="15" fill="#0B6E4F"/>
  <text x="122" y="271" text-anchor="middle" font-size="11" font-weight="600" fill="white">Start free trial</text>

  <!-- Right pane: side panel -->
  <text x="384" y="120" font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="0.5">TEXT BLOCKS</text>

  <!-- Active block (synced with preview) -->
  <rect x="378" y="134" width="172" height="74" rx="6" fill="#EEF2FF"/>
  <rect x="386" y="142" width="20" height="14" rx="3" fill="#F5F3FF"/>
  <text x="396" y="153" text-anchor="middle" font-size="9" font-weight="700" fill="#7C3AED" font-family="ui-monospace, monospace">H1</text>
  <rect x="386" y="164" width="156" height="36" rx="4" fill="white" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="392" y="186" font-size="11" fill="#111827">Calmer focus, every day.</text>

  <!-- Other blocks -->
  <rect x="386" y="220" width="14" height="14" rx="3" fill="#EEF2FF"/>
  <text x="393" y="231" text-anchor="middle" font-size="9" font-weight="700" fill="#4F46E5" font-family="ui-monospace, monospace">P</text>
  <rect x="386" y="240" width="156" height="14" rx="3" fill="white" stroke="#E5E7EB"/>
  <rect x="386" y="258" width="156" height="14" rx="3" fill="white" stroke="#E5E7EB"/>

  <rect x="386" y="282" width="40" height="14" rx="3" fill="#ECFDF5"/>
  <text x="406" y="293" text-anchor="middle" font-size="9" font-weight="700" fill="#059669" font-family="ui-monospace, monospace">BUTTON</text>
  <rect x="386" y="302" width="156" height="20" rx="3" fill="white" stroke="#E5E7EB"/>

  <!-- Sync arrow between panes -->
  <g transform="translate(355, 168)">
    <path d="M0 0 h30" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="3 3" fill="none"/>
    <path d="M28 -4 l4 4 l-4 4" stroke="#4F46E5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Caption -->
  <text x="300" y="368" text-anchor="middle" font-size="12.5" fill="#6B7280">Edit on either side — preview and panel stay in sync.</text>
</svg>
