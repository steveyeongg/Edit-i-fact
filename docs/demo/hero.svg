<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, 'Inter', system-ui, 'Segoe UI', sans-serif" role="img" aria-label="Edit-i-fact editor showing the Aurora landing page in the preview pane with categorised edit panel on the right">
  <defs>
    <linearGradient id="brandGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="auroraHeroGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="appShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="1200" height="720" fill="#FAFAFA"/>

  <!-- App shell card -->
  <g filter="url(#appShadow)">
    <rect x="40" y="36" width="1120" height="648" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <!-- ────────── Toolbar (56px) ────────── -->
  <line x1="40" y1="92" x2="1160" y2="92" stroke="#E5E7EB"/>

  <!-- Brand mark with tagline -->
  <rect x="60" y="50" width="28" height="28" rx="7" fill="url(#brandGrad)"/>
  <text x="74" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="ui-monospace, monospace">E</text>
  <text x="98" y="63" font-size="14.5" font-weight="700" fill="#111827" letter-spacing="-0.3">Edit-i-fact</text>
  <text x="98" y="77" font-size="10.5" fill="#6B7280">Edit HTML artifacts like PowerPoint — without touching code.</text>

  <!-- Filename chip -->
  <rect x="412" y="55" width="190" height="22" rx="6" fill="#F4F4F5" stroke="#E5E7EB"/>
  <text x="421" y="70" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#6B7280">aurora-landing.html</text>
  <circle cx="595" cy="66" r="3" fill="#4F46E5"/>

  <!-- Device toggle -->
  <rect x="640" y="53" width="230" height="26" rx="7" fill="#F4F4F5" stroke="#E5E7EB"/>
  <rect x="644" y="57" width="74" height="18" rx="5" fill="white" filter="url(#cardShadow)"/>
  <text x="681" y="70" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Desktop</text>
  <text x="758" y="70" text-anchor="middle" font-size="12" font-weight="500" fill="#6B7280">Tablet</text>
  <text x="832" y="70" text-anchor="middle" font-size="12" font-weight="500" fill="#6B7280">Mobile</text>

  <!-- Toolbar actions -->
  <rect x="912" y="53" width="32" height="26" rx="6" fill="white" stroke="#E5E7EB"/>
  <path d="M925 62 v6 h6 M923 70 a8 8 0 0 1 13 -5 l2 2" stroke="#9CA3AF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="950" y="53" width="32" height="26" rx="6" fill="white" stroke="#E5E7EB"/>
  <path d="M969 62 v6 h-6 M971 70 a8 8 0 0 0 -13 -5 l-2 2" stroke="#9CA3AF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="988" y="53" width="60" height="26" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="1018" y="70" text-anchor="middle" font-size="12.5" font-weight="500" fill="#111827">Open</text>
  <rect x="1054" y="53" width="106" height="26" rx="6" fill="#4F46E5"/>
  <path d="M1069 66 v6 m-5 -5 l5 5 l5 -5 m-13 8 h16" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1114" y="70" text-anchor="middle" font-size="12.5" font-weight="600" fill="white">Download</text>

  <!-- ────────── Preview area ────────── -->
  <rect x="40" y="92" width="760" height="592" fill="#F0F0F2"/>

  <!-- Preview card (Aurora landing) -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="124" width="680" height="528" rx="10" fill="#FAFAF5"/>
  </g>

  <!-- Aurora nav -->
  <rect x="105" y="148" width="20" height="20" rx="6" fill="url(#brandGrad)"/>
  <text x="132" y="163" font-size="13" font-weight="700" fill="#18181B" letter-spacing="-0.3">Aurora</text>
  <text x="612" y="163" font-size="11" font-weight="500" fill="#52525B">Features</text>
  <text x="654" y="163" font-size="11" font-weight="500" fill="#52525B">Pricing</text>
  <text x="694" y="163" font-size="11" font-weight="500" fill="#52525B">Sign in</text>
  <rect x="725" y="151" width="18" height="18" rx="9" fill="#18181B"/>

  <!-- Eyebrow badge -->
  <rect x="318" y="216" width="204" height="22" rx="11" fill="white" stroke="#E4E4E7"/>
  <circle cx="329" cy="227" r="7" fill="#FEF3C7"/>
  <polygon points="329,222 330.5,225.5 334,226 331.5,228.5 332,232 329,230 326,232 326.5,228.5 324,226 327.5,225.5" fill="#D97706" transform="scale(0.7) translate(140 90)"/>
  <text x="343" y="231" font-size="10.5" font-weight="500" fill="#52525B">Now in public beta — join the waitlist</text>

  <!-- Headline (focused — pulse + outline) -->
  <rect x="178" y="262" width="484" height="78" rx="6" fill="none" stroke="#4F46E5" stroke-width="2"/>
  <rect x="172" y="256" width="496" height="90" rx="8" fill="none" stroke="#4F46E5" stroke-opacity="0.18" stroke-width="3"/>
  <text x="420" y="294" text-anchor="middle" font-size="32" font-weight="400" fill="#18181B" font-family="'Iowan Old Style', Georgia, serif" letter-spacing="-1">Quiet productivity</text>
  <text x="420" y="328" text-anchor="middle" font-size="32" font-weight="400" font-family="'Iowan Old Style', Georgia, serif" letter-spacing="-1">
    <tspan fill="#18181B">for </tspan>
    <tspan fill="url(#auroraHeroGrad)" font-style="italic">makers</tspan>
    <tspan fill="#18181B">.</tspan>
  </text>

  <!-- Lede -->
  <text x="420" y="368" text-anchor="middle" font-size="13" fill="#52525B">Aurora protects deep work without the discipline tax.</text>
  <text x="420" y="386" text-anchor="middle" font-size="13" fill="#52525B">Build the rituals that fit your life, not someone else's.</text>

  <!-- CTAs -->
  <rect x="316" y="412" width="160" height="36" rx="18" fill="#18181B"/>
  <text x="396" y="434" text-anchor="middle" font-size="12" font-weight="600" fill="white">Start free for 14 days  →</text>
  <rect x="484" y="412" width="140" height="36" rx="18" fill="white" stroke="#E4E4E7"/>
  <text x="554" y="434" text-anchor="middle" font-size="12" font-weight="600" fill="#18181B">▶  Watch the demo</text>

  <!-- Stats card -->
  <rect x="125" y="478" width="592" height="92" rx="14" fill="white" stroke="#E4E4E7"/>
  <text x="200" y="510" text-anchor="middle" font-size="22" font-weight="400" fill="#18181B" font-family="'Iowan Old Style', Georgia, serif">12,000+</text>
  <text x="200" y="528" text-anchor="middle" font-size="10" fill="#52525B">Active makers worldwide</text>
  <text x="345" y="510" text-anchor="middle" font-size="22" font-weight="400" fill="#18181B" font-family="'Iowan Old Style', Georgia, serif">4.9 ★</text>
  <text x="345" y="528" text-anchor="middle" font-size="10" fill="#52525B">Average rating</text>
  <text x="495" y="510" text-anchor="middle" font-size="22" font-weight="400" fill="#18181B" font-family="'Iowan Old Style', Georgia, serif">2.3h</text>
  <text x="495" y="528" text-anchor="middle" font-size="10" fill="#52525B">Saved per day</text>
  <text x="640" y="510" text-anchor="middle" font-size="22" font-weight="400" fill="#18181B" font-family="'Iowan Old Style', Georgia, serif">92%</text>
  <text x="640" y="528" text-anchor="middle" font-size="10" fill="#52525B">Retention</text>

  <!-- Cursor on headline -->
  <g transform="translate(642, 296)">
    <path d="M0 0 L0 22 L6 17 L10 26 L14 24 L10 16 L18 16 Z" fill="#18181B" stroke="white" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- ────────── Side panel ────────── -->
  <line x1="800" y1="92" x2="800" y2="684" stroke="#E5E7EB"/>
  <rect x="800" y="92" width="360" height="592" fill="#FFFFFF"/>

  <!-- Panel header -->
  <text x="820" y="120" font-size="13" font-weight="600" fill="#111827">Edit</text>
  <rect x="1118" y="106" width="30" height="18" rx="9" fill="#F4F4F5"/>
  <text x="1133" y="119" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#9CA3AF">12</text>

  <!-- Search input -->
  <rect x="820" y="134" width="324" height="30" rx="6" fill="#F4F4F5" stroke="#E5E7EB"/>
  <circle cx="836" cy="149" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.6"/>
  <line x1="840" y1="153" x2="844" y2="157" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round"/>
  <text x="854" y="153" font-size="12" fill="#9CA3AF">Search text…</text>

  <!-- Replace row -->
  <rect x="820" y="172" width="200" height="28" rx="6" fill="#F4F4F5" stroke="#E5E7EB"/>
  <text x="830" y="190" font-size="12" fill="#9CA3AF">Replace with…</text>
  <rect x="1028" y="172" width="68" height="28" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="1062" y="190" text-anchor="middle" font-size="11.5" fill="#6B7280">Replace</text>
  <rect x="1104" y="172" width="40" height="28" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="1124" y="190" text-anchor="middle" font-size="11.5" fill="#6B7280">All</text>

  <!-- Section: TEXT BLOCKS (expanded) -->
  <g transform="translate(0, 220)">
    <path d="M820 6 l4 4 l4 -4" stroke="#9CA3AF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M838 0 v3 m-2 -3 h4 m-4 6 h4 m-4 3 v3 m-2 -3 h4 m-2 -3 v3" stroke="#9CA3AF" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="852" y="9" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace" fill="#6B7280" letter-spacing="0.8">TEXT BLOCKS</text>
    <rect x="1112" y="-2" width="30" height="16" rx="8" fill="#F4F4F5"/>
    <text x="1127" y="9" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#9CA3AF">5</text>
  </g>

  <!-- H1 row (active) -->
  <rect x="808" y="234" width="344" height="82" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-opacity="0.3"/>
  <rect x="816" y="242" width="22" height="16" rx="4" fill="#F5F3FF"/>
  <text x="827" y="254" text-anchor="middle" font-size="10" font-weight="700" fill="#7C3AED" font-family="ui-monospace, monospace">H1</text>
  <!-- Color picker -->
  <rect x="1098" y="242" width="22" height="16" rx="4" fill="white" stroke="#D1D5DB"/>
  <text x="1109" y="253" text-anchor="middle" font-size="9" font-weight="700" fill="#111827">A</text>
  <line x1="1101" y1="255" x2="1117" y2="255" stroke="#4F46E5" stroke-width="2.4"/>
  <rect x="1124" y="242" width="22" height="16" rx="4" fill="#F59E0B" stroke="#D1D5DB"/>
  <!-- Text content -->
  <rect x="816" y="266" width="328" height="42" rx="6" fill="white" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="824" y="285" font-size="12" fill="#111827">Quiet productivity for makers.</text>
  <text x="824" y="301" font-size="12" fill="#9CA3AF">|</text>

  <!-- P row -->
  <rect x="816" y="324" width="20" height="16" rx="4" fill="#EEF2FF"/>
  <text x="826" y="336" text-anchor="middle" font-size="10" font-weight="700" fill="#4F46E5" font-family="ui-monospace, monospace">P</text>
  <rect x="1098" y="324" width="22" height="16" rx="4" fill="white" stroke="#D1D5DB"/>
  <text x="1109" y="335" text-anchor="middle" font-size="9" font-weight="700" fill="#111827">A</text>
  <rect x="1124" y="324" width="22" height="16" rx="4" fill="white" stroke="#D1D5DB"/>
  <rect x="816" y="348" width="328" height="34" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="824" y="368" font-size="11.5" fill="#6B7280">Aurora protects deep work without the…</text>

  <!-- Section: SHAPES & BOXES (expanded) -->
  <g transform="translate(0, 400)">
    <path d="M820 6 l4 4 l4 -4" stroke="#9CA3AF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="836" y="2" width="9" height="9" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.4"/>
    <text x="852" y="9" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace" fill="#6B7280" letter-spacing="0.8">SHAPES &amp; BOXES</text>
    <rect x="1112" y="-2" width="30" height="16" rx="8" fill="#F4F4F5"/>
    <text x="1127" y="9" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#9CA3AF">4</text>
  </g>

  <!-- Shape row -->
  <rect x="816" y="424" width="60" height="16" rx="4" fill="#FAF5FF"/>
  <text x="846" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#9333EA" font-family="ui-monospace, monospace">DIV.kpi</text>
  <!-- Fill row -->
  <text x="816" y="460" font-size="11" fill="#6B7280">Fill</text>
  <rect x="868" y="448" width="22" height="16" rx="4" fill="#EEF2FF" stroke="#D1D5DB"/>
  <!-- Border row -->
  <text x="816" y="484" font-size="11" fill="#6B7280">Border</text>
  <rect x="868" y="472" width="22" height="16" rx="4" fill="#E4E4E7" stroke="#D1D5DB"/>
  <!-- Radius row -->
  <text x="816" y="508" font-size="11" fill="#6B7280">Radius</text>
  <rect x="868" y="503" width="180" height="4" rx="2" fill="#E5E7EB"/>
  <rect x="868" y="503" width="70" height="4" rx="2" fill="#4F46E5"/>
  <circle cx="938" cy="505" r="6" fill="#4F46E5"/>
  <text x="1118" y="508" font-size="10.5" font-family="ui-monospace, monospace" fill="#9CA3AF" text-anchor="end">14px</text>

  <!-- Section: ICONS (collapsed) -->
  <g transform="translate(0, 540)">
    <path d="M821 4 l4 -4 l4 4" stroke="#9CA3AF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 826 4)"/>
    <polygon points="843 1 845 5 849 5 846 8 847 12 843 10 839 12 840 8 837 5 841 5" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
    <text x="855" y="9" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace" fill="#6B7280" letter-spacing="0.8">ICONS</text>
    <rect x="1112" y="-2" width="30" height="16" rx="8" fill="#F4F4F5"/>
    <text x="1127" y="9" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#9CA3AF">18</text>
  </g>

  <!-- Section: IMAGES (collapsed) -->
  <g transform="translate(0, 580)">
    <path d="M821 4 l4 -4 l4 4" stroke="#9CA3AF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 826 4)"/>
    <rect x="837" y="2" width="9" height="9" rx="1.5" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
    <circle cx="840" cy="5" r="1" fill="#9CA3AF"/>
    <path d="M846 8 l-2 -2 l-3 3" stroke="#9CA3AF" stroke-width="1" fill="none"/>
    <text x="855" y="9" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace" fill="#6B7280" letter-spacing="0.8">IMAGES</text>
    <rect x="1112" y="-2" width="30" height="16" rx="8" fill="#F4F4F5"/>
    <text x="1127" y="9" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#9CA3AF">4</text>
  </g>

</svg>
