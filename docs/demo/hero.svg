<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, 'Inter', system-ui, 'Segoe UI', sans-serif" role="img" aria-label="Edit-i-fact editor showing a landing page in the preview pane with text blocks in the right side panel">
  <defs>
    <linearGradient id="bgShade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F4F6"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="1200" height="720" fill="#FAFAFA"/>

  <!-- App shell card -->
  <g filter="url(#softShadow)">
    <rect x="40" y="36" width="1120" height="648" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <!-- ────────── Toolbar ────────── -->
  <line x1="40" y1="92" x2="1160" y2="92" stroke="#E5E7EB"/>

  <!-- Brand mark -->
  <rect x="60" y="51" width="26" height="26" rx="7" fill="#4F46E5"/>
  <text x="73" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="white">E</text>
  <text x="96" y="71" font-size="15" font-weight="600" fill="#111827" letter-spacing="-0.2">Edit-i-fact</text>

  <!-- Filename chip -->
  <rect x="190" y="56" width="270" height="22" rx="6" fill="#F4F4F5" stroke="#E5E7EB"/>
  <text x="200" y="71" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#6B7280">Q4-launch-deck.html</text>
  <circle cx="448" cy="67" r="3" fill="#4F46E5"/>

  <!-- Device toggle -->
  <rect x="510" y="54" width="240" height="26" rx="7" fill="#F4F4F5" stroke="#E5E7EB"/>
  <rect x="514" y="58" width="76" height="18" rx="5" fill="white" filter="url(#cardShadow)"/>
  <text x="552" y="71" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Desktop</text>
  <text x="630" y="71" text-anchor="middle" font-size="12" font-weight="500" fill="#6B7280">Tablet</text>
  <text x="708" y="71" text-anchor="middle" font-size="12" font-weight="500" fill="#6B7280">Mobile</text>

  <!-- Toolbar actions -->
  <rect x="900" y="54" width="34" height="26" rx="6" fill="white" stroke="#E5E7EB"/>
  <path d="M915 63 v6 h6 M913 71 a8 8 0 0 1 13 -5 l2 2" stroke="#9CA3AF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="940" y="54" width="34" height="26" rx="6" fill="white" stroke="#E5E7EB"/>
  <path d="M959 63 v6 h-6 M961 71 a8 8 0 0 0 -13 -5 l-2 2" stroke="#9CA3AF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="980" y="54" width="62" height="26" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="1011" y="71" text-anchor="middle" font-size="12.5" font-weight="500" fill="#111827">Open</text>
  <rect x="1048" y="54" width="112" height="26" rx="6" fill="#4F46E5"/>
  <path d="M1063 67 v6 m-5 -5 l5 5 l5 -5 m-13 8 h16" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1110" y="71" text-anchor="middle" font-size="12.5" font-weight="600" fill="white">Download</text>

  <!-- ────────── Preview area ────────── -->
  <rect x="40" y="92" width="760" height="592" fill="#F0F0F2"/>

  <!-- Preview wrap (the artifact card) -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="124" width="680" height="528" rx="10" fill="white"/>
  </g>

  <!-- Artifact content: stylized landing page -->
  <!-- Eyebrow -->
  <rect x="312" y="184" width="216" height="22" rx="11" fill="#EEF2FF"/>
  <text x="420" y="200" text-anchor="middle" font-size="11" font-weight="500" fill="#4F46E5">New — daily mode is live</text>

  <!-- Headline (focused — will get the indicator outline) -->
  <text x="420" y="262" text-anchor="middle" font-size="34" font-weight="600" fill="#111827" letter-spacing="-1.3">Calmer focus, every day.</text>

  <!-- Focus outline on the headline -->
  <rect x="155" y="232" width="530" height="44" rx="4" fill="none" stroke="#4F46E5" stroke-width="2"/>

  <!-- Lede -->
  <text x="420" y="312" text-anchor="middle" font-size="14.5" fill="#6B7280">A quiet focus companion that ends the noise of</text>
  <text x="420" y="330" text-anchor="middle" font-size="14.5" fill="#6B7280">notification stacks. No discipline tax.</text>

  <!-- CTA buttons -->
  <rect x="320" y="368" width="200" height="42" rx="21" fill="#0B6E4F"/>
  <text x="420" y="394" text-anchor="middle" font-size="13.5" font-weight="600" fill="white">Start free for 14 days</text>
  <rect x="528" y="368" width="120" height="42" rx="21" fill="white" stroke="#E5E7EB"/>
  <text x="588" y="394" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111827">Take the tour</text>

  <!-- Cursor pointing at the headline -->
  <g transform="translate(630, 264)">
    <path d="M0 0 L0 22 L6 17 L10 26 L14 24 L10 16 L18 16 Z" fill="#111827" stroke="white" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- Feature cards section -->
  <rect x="125" y="448" width="170" height="140" rx="14" fill="#FAFAFA" stroke="#E5E7EB"/>
  <text x="148" y="478" font-size="13" font-weight="600" fill="#111827">Single-task focus</text>
  <rect x="148" y="490" width="124" height="6" rx="2" fill="#E5E7EB"/>
  <rect x="148" y="504" width="98" height="6" rx="2" fill="#E5E7EB"/>
  <rect x="148" y="518" width="118" height="6" rx="2" fill="#E5E7EB"/>

  <rect x="335" y="448" width="170" height="140" rx="14" fill="#FAFAFA" stroke="#E5E7EB"/>
  <text x="358" y="478" font-size="13" font-weight="600" fill="#111827">Gentle reset</text>
  <rect x="358" y="490" width="124" height="6" rx="2" fill="#E5E7EB"/>
  <rect x="358" y="504" width="106" height="6" rx="2" fill="#E5E7EB"/>
  <rect x="358" y="518" width="92" height="6" rx="2" fill="#E5E7EB"/>

  <rect x="545" y="448" width="170" height="140" rx="14" fill="#FAFAFA" stroke="#E5E7EB"/>
  <text x="568" y="478" font-size="13" font-weight="600" fill="#111827">End-of-day note</text>
  <rect x="568" y="490" width="124" height="6" rx="2" fill="#E5E7EB"/>
  <rect x="568" y="504" width="110" height="6" rx="2" fill="#E5E7EB"/>
  <rect x="568" y="518" width="84" height="6" rx="2" fill="#E5E7EB"/>

  <!-- ────────── Side panel ────────── -->
  <line x1="800" y1="92" x2="800" y2="684" stroke="#E5E7EB"/>
  <rect x="800" y="92" width="360" height="592" fill="#FFFFFF"/>

  <!-- Panel header -->
  <text x="820" y="122" font-size="12.5" font-weight="600" fill="#111827">Text blocks</text>
  <rect x="1112" y="108" width="32" height="18" rx="9" fill="#F4F4F5"/>
  <text x="1128" y="121" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#9CA3AF">7</text>

  <!-- Search input -->
  <rect x="820" y="138" width="324" height="30" rx="6" fill="#F4F4F5" stroke="#E5E7EB"/>
  <circle cx="836" cy="153" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.6"/>
  <line x1="840" y1="157" x2="844" y2="161" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round"/>
  <text x="854" y="157" font-size="12" fill="#9CA3AF">Search text…</text>

  <!-- Replace row -->
  <rect x="820" y="176" width="200" height="28" rx="6" fill="#F4F4F5" stroke="#E5E7EB"/>
  <text x="830" y="194" font-size="12" fill="#9CA3AF">Replace with…</text>
  <rect x="1028" y="176" width="68" height="28" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="1062" y="194" text-anchor="middle" font-size="11.5" fill="#6B7280">Replace</text>
  <rect x="1104" y="176" width="40" height="28" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="1124" y="194" text-anchor="middle" font-size="11.5" fill="#6B7280">All</text>

  <!-- Block items -->
  <!-- Active item: H1 (highlighted) -->
  <rect x="812" y="226" width="336" height="76" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-opacity="0.25"/>
  <rect x="820" y="234" width="24" height="16" rx="4" fill="#F5F3FF"/>
  <text x="832" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="#7C3AED" font-family="ui-monospace, monospace">H1</text>
  <rect x="1118" y="234" width="22" height="16" rx="4" fill="white" stroke="#D1D5DB"/>
  <text x="1129" y="246" text-anchor="middle" font-size="9" font-weight="700" fill="#111827">A</text>
  <line x1="1121" y1="247" x2="1137" y2="247" stroke="#4F46E5" stroke-width="2.4"/>
  <rect x="820" y="258" width="320" height="36" rx="6" fill="white" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="828" y="280" font-size="12.5" fill="#111827">Calmer focus, every day.</text>

  <!-- Item 2: P -->
  <rect x="820" y="312" width="20" height="16" rx="4" fill="#EEF2FF"/>
  <text x="830" y="324" text-anchor="middle" font-size="10" font-weight="700" fill="#4F46E5" font-family="ui-monospace, monospace">P</text>
  <rect x="820" y="336" width="320" height="48" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="828" y="354" font-size="12" fill="#6B7280">A quiet focus companion that ends the noise of</text>
  <text x="828" y="370" font-size="12" fill="#6B7280">notification stacks. No discipline tax.</text>

  <!-- Item 3: BUTTON -->
  <rect x="820" y="402" width="50" height="16" rx="4" fill="#ECFDF5"/>
  <text x="845" y="414" text-anchor="middle" font-size="10" font-weight="700" fill="#059669" font-family="ui-monospace, monospace">BUTTON</text>
  <rect x="820" y="426" width="320" height="32" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="828" y="446" font-size="12" fill="#111827">Start free for 14 days</text>

  <!-- Item 4: H3 -->
  <rect x="820" y="478" width="24" height="16" rx="4" fill="#F5F3FF"/>
  <text x="832" y="490" text-anchor="middle" font-size="10" font-weight="700" fill="#7C3AED" font-family="ui-monospace, monospace">H3</text>
  <rect x="820" y="502" width="320" height="32" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="828" y="522" font-size="12" fill="#111827">Single-task focus</text>

  <!-- Item 5: P -->
  <rect x="820" y="554" width="20" height="16" rx="4" fill="#EEF2FF"/>
  <text x="830" y="566" text-anchor="middle" font-size="10" font-weight="700" fill="#4F46E5" font-family="ui-monospace, monospace">P</text>
  <rect x="820" y="578" width="320" height="48" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="828" y="596" font-size="12" fill="#6B7280">Pick one thing. Lumen quiets everything else</text>
  <text x="828" y="612" font-size="12" fill="#6B7280">— even the things you forgot to quiet.</text>

</svg>
