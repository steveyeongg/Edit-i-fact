<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit-i-fact — Edit HTML artifacts like PowerPoint</title>
<style>
  :root {
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --surface-alt: #F4F4F5;
    --border: #E5E7EB;
    --border-strong: #D1D5DB;
    --text: #111827;
    --text-muted: #6B7280;
    --text-subtle: #9CA3AF;
    --accent: #4F46E5;
    --accent-hover: #4338CA;
    --accent-soft: #EEF2FF;
    --danger: #DC2626;
    --success: #059669;
    --radius: 8px;
    --radius-sm: 6px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.04);
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  input, textarea {
    font: inherit;
    color: inherit;
  }

  /* ───── Toolbar ───── */
  .toolbar {
    height: 56px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .brand-mark {
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }
  .brand-mark .dot {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent) 0%, #7C3AED 100%);
    border-radius: 7px;
    display: grid; place-items: center;
    color: white;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 1px 2px rgba(79, 70, 229, 0.25);
    flex-shrink: 0;
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
    min-width: 0;
  }
  .brand-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .brand-tagline {
    font-size: 10.5px;
    font-weight: 400;
    color: var(--text-muted);
    margin-top: 2px;
    letter-spacing: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 380px;
  }
  @media (max-width: 1180px) {
    .brand-tagline { display: none; }
  }
  .filename {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-muted);
    padding: 4px 8px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: none;
  }
  .filename.visible { display: inline-block; }
  .filename.dirty::after {
    content: "•";
    color: var(--accent);
    margin-left: 4px;
  }

  .device-toggle {
    display: inline-flex;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 2px;
    gap: 2px;
  }
  .device-toggle button {
    padding: 5px 12px;
    border-radius: 5px;
    color: var(--text-muted);
    font-size: 13px;
    transition: all 0.12s ease;
  }
  .device-toggle button:hover { color: var(--text); }
  .device-toggle button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
  }
  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--surface-alt); border-color: var(--border-strong); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.primary:disabled:hover { background: var(--accent); }
  .btn.icon {
    width: 32px;
    padding: 0;
    justify-content: center;
    color: var(--text-muted);
  }
  .btn.icon:hover { color: var(--text); }
  .btn svg { width: 14px; height: 14px; }

  /* ───── Workspace ───── */
  .workspace {
    display: flex;
    height: calc(100vh - 56px);
    overflow: hidden;
  }

  /* ───── Empty state ───── */
  .empty-state {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 48px 32px;
  }
  .drop-zone {
    width: 100%;
    max-width: 520px;
    padding: 64px 40px;
    background: var(--surface);
    border: 2px dashed var(--border-strong);
    border-radius: var(--radius-lg);
    text-align: center;
    transition: all 0.16s ease;
    cursor: pointer;
  }
  .drop-zone:hover,
  .drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .drop-zone .icon-frame {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    background: var(--accent-soft);
    border-radius: var(--radius);
    display: grid;
    place-items: center;
    color: var(--accent);
  }
  .drop-zone .icon-frame svg { width: 28px; height: 28px; }
  .drop-zone h2 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .drop-zone .sub {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .drop-zone .accent-line {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--text-subtle);
    font-size: 13px;
    line-height: 1.5;
  }
  .drop-zone .accent-line strong {
    color: var(--accent);
    font-weight: 600;
  }
  .link-btn {
    color: var(--accent);
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .link-btn:hover { color: var(--accent-hover); }

  .error-banner {
    margin-top: 20px;
    padding: 10px 14px;
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-radius: var(--radius-sm);
    color: var(--danger);
    font-size: 13px;
    display: none;
  }
  .error-banner.visible { display: block; }

  /* ───── Preview area ───── */
  .preview-area {
    flex: 1;
    background: #F0F0F2;
    overflow: auto;
    padding: 24px;
    display: none;
  }
  .preview-area.visible { display: flex; justify-content: center; }
  .preview-wrap {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    transition: max-width 0.24s ease;
    width: 100%;
    height: 100%;
    min-height: 600px;
    display: flex;
  }
  .preview-wrap[data-device="desktop"] { max-width: 100%; }
  .preview-wrap[data-device="tablet"] { max-width: 820px; }
  .preview-wrap[data-device="mobile"] { max-width: 420px; }
  .preview-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    flex: 1;
  }

  /* ───── Side panel ───── */
  .side-panel {
    width: 400px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .side-panel.visible { display: flex; }

  .panel-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .panel-title h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.005em;
    color: var(--text);
  }
  .panel-title .count {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-subtle);
    background: var(--surface-alt);
    padding: 2px 7px;
    border-radius: 999px;
  }
  .search-row {
    position: relative;
    margin-bottom: 8px;
  }
  .search-row input {
    width: 100%;
    height: 32px;
    padding: 0 78px 0 32px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    transition: border-color 0.12s ease;
  }
  .search-row input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }
  /* Suppress native clear button — we render our own. */
  .search-row input[type="search"]::-webkit-search-cancel-button,
  .search-row input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
  .search-row .search-icon {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--text-subtle);
    pointer-events: none;
  }
  .search-row .match-count {
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-subtle);
    pointer-events: none;
  }
  .search-row .search-clear {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: var(--text-subtle);
    transition: all 0.12s ease;
  }
  .search-row .search-clear:hover { background: var(--border); color: var(--text); }
  .search-row .search-clear.visible { display: inline-flex; }
  .search-row .search-clear svg { width: 12px; height: 12px; }
  .replace-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 6px;
  }
  .replace-row input {
    height: 30px;
    padding: 0 10px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
  }
  .replace-row input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }
  .replace-row button {
    height: 30px;
    padding: 0 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12.5px;
    color: var(--text-muted);
    transition: all 0.12s ease;
  }
  .replace-row button:hover { background: var(--surface-alt); color: var(--text); }

  .block-list {
    flex: 1;
    overflow: auto;
    padding: 4px 8px 24px;
  }
  .block-list:empty::after {
    content: "No editable text detected.";
    display: block;
    padding: 32px;
    text-align: center;
    color: var(--text-subtle);
    font-size: 13px;
  }

  /* Section headers — group rows by category */
  .panel-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 10px 6px;
    margin-top: 8px;
    border-top: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s ease;
  }
  .panel-section:hover { background: var(--surface-alt); }
  .panel-section:first-child {
    border-top: none;
    margin-top: 0;
    padding-top: 6px;
  }
  .panel-section.hidden-by-search { display: none; }
  .panel-section-title {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-subtle);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .panel-section:hover .panel-section-title { color: var(--text-muted); }
  .panel-section-chevron {
    width: 12px;
    height: 12px;
    color: var(--text-subtle);
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .panel-section.collapsed .panel-section-chevron {
    transform: rotate(-90deg);
  }
  .panel-section-icon {
    width: 12px;
    height: 12px;
    color: var(--text-subtle);
  }
  .panel-section-count {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-subtle);
    background: var(--surface-alt);
    padding: 1px 7px;
    border-radius: 999px;
  }
  .block-item.hidden-by-collapse { display: none; }

  /* Brief pulse when navigated to from the preview iframe */
  @keyframes editifact-focus-pulse {
    0%   { box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.50); }
    60%  { box-shadow: 0 0 0 6px rgba(79, 70, 229, 0.18); }
    100% { box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); }
  }
  .block-item.focus-pulse { animation: editifact-focus-pulse 0.9s ease-out; }
  .block-item {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    transition: background 0.12s ease;
    cursor: pointer;
    scroll-margin: 8px;
  }
  .block-item:hover { background: var(--surface-alt); }
  .block-item.active {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px rgba(79, 70, 229, 0.2);
  }
  .block-item.hidden-by-search { display: none; }
  .block-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .block-tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .block-tag.tag-h1, .block-tag.tag-h2, .block-tag.tag-h3 { color: #7C3AED; background: #F5F3FF; }
  .block-tag.tag-button { color: #059669; background: #ECFDF5; }
  .block-tag.tag-a { color: #0284C7; background: #F0F9FF; }
  .block-tag.tag-img { color: #C2410C; background: #FFF7ED; }
  .block-tag.tag-div { color: var(--text-muted); background: #F1F5F9; }
  .block-meta-spacer { flex: 1; }
  .color-control {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }
  .color-control label {
    position: relative;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    border: 1px solid var(--border-strong);
    cursor: pointer;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.12s ease;
  }
  .color-control label:hover { border-color: var(--accent); }
  .color-control label::after {
    content: "";
    position: absolute;
    left: 3px; right: 3px; bottom: 2px;
    height: 3px;
    background: var(--color-swatch, transparent);
    border-radius: 1px;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .color-control input[type="color"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .color-clear {
    color: var(--text-subtle);
    width: 18px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
    transition: color 0.12s ease;
  }
  .color-clear:hover { color: var(--danger); }
  .color-clear[hidden] { display: none; }

  /* Image rows */
  .image-row {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 10px;
    align-items: start;
  }
  .image-thumb-wrap {
    width: 72px;
    height: 72px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
  }
  .image-thumb-wrap img {
    max-width: 100%;
    max-height: 100%;
    display: block;
  }
  .image-controls { display: flex; flex-direction: column; gap: 6px; }
  .image-controls input[type="text"] {
    width: 100%;
    height: 28px;
    padding: 0 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
  }
  .image-controls input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
  }
  .btn-replace {
    height: 28px;
    padding: 0 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12.5px;
    color: var(--text-muted);
    align-self: flex-start;
    transition: all 0.12s ease;
  }
  .btn-replace:hover { background: var(--surface-alt); color: var(--text); border-color: var(--border-strong); }

  /* Solid color swatch (background/border/icon pickers) — the whole label is
     the swatch, no underline. */
  .color-control label.solid {
    background: white;
    background-image: linear-gradient(45deg, transparent 46%, var(--text-subtle) 46%, var(--text-subtle) 54%, transparent 54%);
  }
  .color-control label.solid[style*="background"] {
    background-image: none;
  }
  .color-control label.solid::after {
    display: none;
  }

  /* Shape rows */
  .shape-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .style-row {
    display: grid;
    grid-template-columns: 56px 1fr;
    align-items: center;
    gap: 8px;
  }
  .style-row-body {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .style-label {
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .style-value {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-subtle);
    min-width: 32px;
    text-align: right;
  }
  .radius-slider {
    flex: 1;
    height: 4px;
    accent-color: var(--accent);
    cursor: pointer;
    min-width: 0;
  }

  /* Icon rows */
  .icon-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-preview {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .icon-preview svg {
    width: 32px;
    height: 32px;
    max-width: 100%;
    max-height: 100%;
  }
  .icon-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }

  /* New tag colors */
  .block-tag.tag-shape { color: #9333EA; background: #FAF5FF; }
  .block-tag.tag-icon-svg { color: #DB2777; background: #FDF2F8; }

  /* ─── Per-row action buttons (move up / down / delete) ─── */
  .row-actions {
    display: inline-flex;
    align-items: center;
    gap: 1px;
    margin-left: 4px;
    flex-shrink: 0;
  }
  .row-action {
    width: 22px;
    height: 22px;
    padding: 0;
    border-radius: 4px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-subtle);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s ease;
  }
  .row-action:hover {
    background: var(--surface-alt);
    color: var(--text);
    border-color: var(--border);
  }
  .row-action.danger:hover {
    color: var(--danger);
    border-color: #FECACA;
    background: #FEF2F2;
  }
  .row-action:disabled,
  .row-action[aria-disabled="true"] {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .row-action svg { width: 12px; height: 12px; }

  /* ─── Text row extras: font dropdown, href input ─── */
  .extras-row {
    display: grid;
    grid-template-columns: 36px 1fr;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .extras-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .font-select {
    height: 26px;
    padding: 0 26px 0 8px;

    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;

  }
  .font-select:focus {

    height: 26px;
    padding: 0 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);

  }
  .href-input:focus {

  .block-url {

  .block-text:focus {

  }
  .block-item mark {
    background: #FEF3C7;
    color: var(--text);
    padding: 0 1px;
    border-radius: 2px;
  }

  /* ───── Toasts ───── */
  .toast-host {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
    pointer-events: none;
  }
  .toast {
    background: var(--text);
    color: white;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-md);
    animation: toast-in 0.18s ease-out;
    pointer-events: auto;
  }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ───── Resume prompt ───── */
  .resume-prompt {
    position: fixed;
    top: 76px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);

    padding: 4px 8px;
    border-radius: 4px;

  .resume-prompt button:hover { background: var(--accent-soft); }

  /* Hidden util */

    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;

<script>
(() => {
  'use strict';

  // ─────────────────────────────────────────────
  // Editable element detection rules
  // ─────────────────────────────────────────────
  const Detector = (() => {
    // Block-level + structural tags that hold text. DIV is included because
    // modern AI-generated artifacts use <div> as the primary text container.
    const TEXT_ALLOWLIST = new Set([
      'DIV',
      'H1','H2','H3','H4','H5','H6',
      'P','A','BUTTON','LI',
      'FIGCAPTION','BLOCKQUOTE','LABEL','SUMMARY',
      'DT','DD','CAPTION','TH','TD','TIME',
      // Inline formatting tags — qualify only when standalone (see INLINE_PARENT_SKIP).
      'SPAN','B','STRONG','EM','I','U','MARK','CODE','SMALL','SUB','SUP','ABBR'
    ]);
    // Inline tags skipped when their parent is already an allowlist tag —
    // parent owns the row, prevents double-tagging "Hello <b>world</b>".
    const INLINE_PARENT_SKIP = new Set([
      'SPAN','B','STRONG','EM','I','U','MARK','CODE','SMALL','SUB','SUP','ABBR'
    ]);
    const FORBIDDEN_ANCESTORS = new Set([
      'SCRIPT','STYLE','HEAD','NOSCRIPT','TEMPLATE','SVG'
    ]);

    function hasForbiddenAncestor(el) {
      let p = el.parentElement;
      while (p) {
        // SVG (and foreign content) reports tagName lowercase — normalize.
        if (FORBIDDEN_ANCESTORS.has(p.tagName.toUpperCase())) return true;
        p = p.parentElement;
      }
      return false;
    }

    function hasDirectText(el) {
      for (const node of el.childNodes) {
        if (node.nodeType === 3 && node.textContent.trim().length > 0) return true;
      }
      return false;
    }

    function isIconOnly(text) {
      // Skip only the most obvious chrome glyphs (close/add/check/dismiss icons
      // that AI artifacts use as button labels). Real placeholders like "—"
      // and "?" stay editable.
      const t = text.trim();
      if (t.length !== 1) return false;
      return /[×✕✖✗✘＋+×✓✕✖✗✘]/.test(t);
    }

    // Container tags eligible to become "shape" rows (after iframe-load
    // computed-style filtering reveals visible bg/border).
    const SHAPE_CANDIDATE_TAGS = new Set([
      'DIV','SECTION','ARTICLE','ASIDE','HEADER','FOOTER','NAV','MAIN',
      'FIGURE','UL','OL','TABLE','TR','TD','TH','THEAD','TBODY','TFOOT',
      'FIELDSET','BLOCKQUOTE','BUTTON'
    ]);

    // Returns { type: 'text' | 'image' | 'icon' | 'shape-candidate' } if the
    // element is worth tracking, otherwise null.
    function classify(el) {
      if (!el || el.nodeType !== 1) return null;
      if (el.hasAttribute('hidden')) return null;

      // SVG icons: must be inline <svg> (not nested in another <svg>), and not
      // forbidden. We allow elements inside SVG only at the root level.
      if (el.tagName && el.tagName.toLowerCase() === 'svg') {
        if (hasForbiddenAncestorExcludingSvg(el)) return null;
        // Skip nested SVGs (we only tag the outermost).
        let p = el.parentElement;
        while (p) {
          if (p.tagName && p.tagName.toLowerCase() === 'svg') return null;
          p = p.parentElement;
        }
        return { type: 'icon' };
      }

      if (hasForbiddenAncestor(el)) return null;

      if (el.tagName === 'IMG') {
        const src = el.getAttribute('src') || '';
        if (!src) return null;
        return { type: 'image' };
      }

      if (TEXT_ALLOWLIST.has(el.tagName) && hasDirectText(el)) {
        const text = el.textContent.trim();
        if (text && !isIconOnly(text)) {
          // Inline tag inside allowlist parent: skip — parent owns the row.
          if (INLINE_PARENT_SKIP.has(el.tagName)) {
            const parent = el.parentElement;
            if (parent && TEXT_ALLOWLIST.has(parent.tagName)) return null;
          }
          return { type: 'text' };
        }
      }

      // Shape candidate — final confirmation happens after iframe load using
      // computed styles. We tag now so the same id exists in both source and
      // iframe DOMs.
      if (SHAPE_CANDIDATE_TAGS.has(el.tagName)) {
        return { type: 'shape-candidate' };
      }

      return null;
    }

    function hasForbiddenAncestorExcludingSvg(el) {
      let p = el.parentElement;
      while (p) {
        const t = p.tagName.toUpperCase();
        if (t !== 'SVG' && FORBIDDEN_ANCESTORS.has(t)) return true;
        p = p.parentElement;
      }
      return false;
    }

    return { classify };
  })();

  // ─────────────────────────────────────────────
  // Document model — single source of truth
  //
  // Items can be type:'text' | 'image' | 'shape' | 'icon'. Mutations fire one
  // onChange event with { kind, id, before, after, origin } — kind is the
  // property that changed: 'text' | 'color' | 'bgColor' | 'borderColor' |
  // 'borderRadius' | 'fontFamily' | 'fontSize' | 'iconColor' | 'imageSrc' | 'imageAlt'.
  //
  // Shapes are detected in two phases: parse-time tags candidates, then after
  // the iframe loads we check computed styles to confirm which candidates
  // actually have a visible bg/border/shadow/gradient. Computed values are
  // captured after the iframe loads, so class-based formatting is editable too.
  // ─────────────────────────────────────────────
  const DocModel = (() => {
    let doc = null;
    let items = [];
    let pendingShapeCandidates = []; // {id, sourceEl} — pending iframe filter
    let pendingIconCandidates = [];
    const listeners = new Set();
    let nextId = 0;

    function load(htmlString) {
      const parser = new DOMParser();
      doc = parser.parseFromString(htmlString, 'text/html');
      items = [];
      pendingShapeCandidates = [];
      pendingIconCandidates = [];
      nextId = 0;

      const walker = doc.createTreeWalker(doc.body || doc, NodeFilter.SHOW_ELEMENT);
      let n = walker.currentNode;
      while (n) {
        const cls = Detector.classify(n);
        if (cls) {
          const id = 'ef-' + (nextId++);
          n.setAttribute('data-edit-id', id);
          if (cls.type === 'text') {
            items.push({
              id, type: 'text',
              tag: n.tagName,
              text: n.textContent,
              href: n.tagName === 'A' ? n.getAttribute('href') : null,
              color: n.style ? (n.style.color || '') : '',
              bgColor: n.style ? (n.style.backgroundColor || '') : '',
              fontFamily: n.style ? (n.style.fontFamily || '') : '',
              fontSize: n.style ? (parseFloat(n.style.fontSize) || 0) : 0
            });
          } else if (cls.type === 'image') {
            items.push({
              id, type: 'image',
              src: n.getAttribute('src') || '',
              alt: n.getAttribute('alt') || ''
            });
          } else if (cls.type === 'shape-candidate') {
            pendingShapeCandidates.push({ id, sourceEl: n });
          } else if (cls.type === 'icon') {
            pendingIconCandidates.push({ id, sourceEl: n });
          }
        }
        n = walker.nextNode();
      }

      return { textCount: items.length, candidates: pendingShapeCandidates.length + pendingIconCandidates.length };
    }

    // Phase 2 — called after the iframe has rendered. Reads computed styles
    // to promote shape candidates with visible bg/border into shape items,
    // and inline SVGs into icon items.
    function completeDetection(iframeDoc) {
      if (!doc || !iframeDoc) return;
      const win = iframeDoc.defaultView || window;

      // Text sizing — many artifacts define typography via CSS classes, so
      // parse-time inline style checks are not enough for a useful size slider.
      for (const item of items) {
        if (item.type !== 'text') continue;
        const iframeEl = iframeDoc.querySelector('[data-edit-id="' + item.id + '"]');
        if (!iframeEl) continue;
        const cs = win.getComputedStyle(iframeEl);
        const size = parseFloat(cs.fontSize) || 0;
        if (size) item.fontSize = size;
        item.color = rgbToHex(cs.color) || item.color || '';
        item.bgColor = (cs.backgroundColor && cs.backgroundColor !== 'rgba(0, 0, 0, 0)' && cs.backgroundColor !== 'transparent')
          ? rgbToHex(cs.backgroundColor) : (item.bgColor || '');
        item.fontWeight = cs.fontWeight || '400';
        item.textAlign = cs.textAlign || 'left';
        item.lineHeight = cs.lineHeight === 'normal' ? '' : (parseFloat(cs.lineHeight) || '');
        item.letterSpacing = cs.letterSpacing === 'normal' ? '' : (parseFloat(cs.letterSpacing) || '');
        item.opacity = Number.isFinite(parseFloat(cs.opacity)) ? parseFloat(cs.opacity) : 1;
        item.borderColor = parseFloat(cs.borderTopWidth) ? (rgbToHex(cs.borderTopColor) || '') : '';
        item.borderWidth = parseFloat(cs.borderTopWidth) || 0;
        item.borderStyle = cs.borderTopStyle || 'solid';
        item.borderRadius = parseFloat(cs.borderTopLeftRadius) || 0;
        item.padding = parseFloat(cs.paddingTop) || 0;
        item.boxShadow = cs.boxShadow && cs.boxShadow !== 'none' ? cs.boxShadow : '';
      }

      // Shapes
      for (const cand of pendingShapeCandidates) {
        const iframeEl = iframeDoc.querySelector('[data-edit-id="' + cand.id + '"]');
        if (!iframeEl) { dropCandidate(cand, null); continue; }
        const cs = win.getComputedStyle(iframeEl);
        const bg = cs.backgroundColor;
        const bgImage = cs.backgroundImage;
        const borderTopColor = cs.borderTopColor;
        const borderTopWidth = parseFloat(cs.borderTopWidth) || 0;
        const borderStyle = cs.borderTopStyle || 'solid';
        const radius = parseFloat(cs.borderTopLeftRadius) || 0;
        const shadow = cs.boxShadow && cs.boxShadow !== 'none' ? cs.boxShadow : '';
        const opacity = Number.isFinite(parseFloat(cs.opacity)) ? parseFloat(cs.opacity) : 1;

        const hasBg = bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent';
        const hasBgImage = bgImage && bgImage !== 'none';
        const hasBorder = borderTopWidth > 0 && borderTopColor !== 'rgba(0, 0, 0, 0)';

        // Skip the document body and containers with no visible chrome.
        if (iframeEl === iframeDoc.body || (!hasBg && !hasBgImage && !hasBorder && radius === 0 && !shadow)) {
          dropCandidate(cand, iframeEl);
          continue;
        }

        // Build a short label like "DIV.kpi" or "SECTION"
        const tag = cand.sourceEl.tagName;
        const cls = cand.sourceEl.getAttribute('class') || '';
        const firstClass = cls.split(/\s+/).filter(Boolean)[0];
        const label = firstClass ? tag + '.' + firstClass : tag;

        items.push({
          id: cand.id,
          type: 'shape',
          tag, label,
          bgColor: hasBg ? rgbToHex(bg) : '',
          backgroundImage: hasBgImage ? bgImage : '',
          borderColor: hasBorder ? rgbToHex(borderTopColor) : '',
          borderWidth: borderTopWidth,
          borderStyle,
          borderRadius: radius,
          boxShadow: shadow,
          opacity
        });
      }
      pendingShapeCandidates = [];

      // Icons
      for (const cand of pendingIconCandidates) {
        const iframeEl = iframeDoc.querySelector('[data-edit-id="' + cand.id + '"]');
        if (!iframeEl) { dropCandidate(cand, null); continue; }
        const rect = iframeEl.getBoundingClientRect ? iframeEl.getBoundingClientRect() : null;
        // Skip large SVGs (probably charts or illustrations).
        if (rect && (rect.width > 96 || rect.height > 96 || rect.width === 0 || rect.height === 0)) {
          dropCandidate(cand, iframeEl);
          continue;
        }

        const cs = win.getComputedStyle(iframeEl);
        const fill = iframeEl.getAttribute('fill') || cs.fill || cs.color;
        const label = cand.sourceEl.tagName.toUpperCase();
        items.push({
          id: cand.id,
          type: 'icon',
          label,
          color: rgbToHex(fill) || ''
        });
      }
      pendingIconCandidates = [];

      function dropCandidate(cand, iframeEl) {
        // Remove data-edit-id from both DOMs so the candidate doesn't show
        // hover outlines or absorb clicks.
        if (cand.sourceEl) cand.sourceEl.removeAttribute('data-edit-id');
        if (iframeEl) iframeEl.removeAttribute('data-edit-id');
      }

      return { count: items.length };
    }

    function rgbToHex(input) {
      if (!input) return '';
      const s = String(input).trim();
      if (/^#[0-9a-f]{6}$/i.test(s)) return s.toLowerCase();
      const m = s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
      if (!m) return '';
      return '#' +
        (+m[1]).toString(16).padStart(2, '0') +
        (+m[2]).toString(16).padStart(2, '0') +
        (+m[3]).toString(16).padStart(2, '0');
    }

    function getItem(id) {
      return items.find(b => b.id === id) || null;
    }

    function list() {
      return items.slice();
    }

    function getElement(id) {
      if (!doc) return null;
      return doc.querySelector('[data-edit-id="' + id + '"]');
    }

    function notify(payload) {
      for (const fn of listeners) {
        try { fn(payload); } catch (e) { console.error(e); }
      }
    }

    function setText(id, text, options) {
      options = options || {};
      const item = getItem(id);
      const el = getElement(id);
      if (!item || !el || item.type !== 'text') return false;
      const before = item.text;
      if (before === text) return false;
      el.textContent = text;
      item.text = text;
      notify({ kind: 'text', id, before, after: text, origin: options.origin || 'model' });
      return true;
    }

    function setColor(id, color, options) {
      options = options || {};
      const item = getItem(id);
      const el = getElement(id);
      if (!item || !el || item.type !== 'text') return false;
      const before = item.color || '';
      const after = color || '';
      if (before === after) return false;
      if (after) el.style.color = after;
      else el.style.removeProperty('color');
      item.color = after;
      notify({ kind: 'color', id, before, after, origin: options.origin || 'model' });
      return true;
    }

    function setImageSrc(id, src, options) {
      options = options || {};
      const item = getItem(id);
      const el = getElement(id);
      if (!item || !el || item.type !== 'image') return false;
      const before = item.src;
      if (before === src) return false;
      el.setAttribute('src', src);
      item.src = src;
      notify({ kind: 'imageSrc', id, before, after: src, origin: options.origin || 'model' });
      return true;
    }

    function setImageAlt(id, alt, options) {
      options = options || {};
      const item = getItem(id);
      const el = getElement(id);
      if (!item || !el || item.type !== 'image') return false;
      const before = item.alt;
      if (before === alt) return false;
      el.setAttribute('alt', alt);
      item.alt = alt;
      notify({ kind: 'imageAlt', id, before, after: alt, origin: options.origin || 'model' });
      return true;
    }

    function setBgColor(id, color, options) {
      options = options || {};
      const item = getItem(id);
      const el = getElement(id);
      if (!item || !el) return false;
      const before = item.bgColor || '';
      const after = color || '';
      if (before === after) return false;
      if (after) el.style.backgroundColor = after;
      else el.style.removeProperty('background-color');
      item.bgColor = after;
      notify({ kind: 'bgColor', id, before, after, origin: options.origin || 'model' });
      return true;
    }

    function setBorderColor(id, color, options) {
      options = options || {};
      const item = getItem(id);

    function moveItem(id, direction, options) {
      options = options || {};
      const item = getItem(id);
      const el = getElement(id);
      if (!item || !el) return false;
      const parent = el.parentNode;
      if (!parent) return false;
      if (direction === 'up') {

        if (!prev) return false;
        parent.insertBefore(el, prev);
      } else if (direction === 'down') {

  // ─────────────────────────────────────────────
  // History — undo/redo of edit deltas
  // ─────────────────────────────────────────────
  const History = (() => {
    const MAX = 100;
    let stack = [];
    let index = -1; // points to last applied
    const listeners = new Set();

    // Kinds where each user action should be its own undo step (never
    // coalesced) — moves, deletes, font swaps, etc. read better as discrete.
    const NON_COALESCE = new Set(['move', 'delete', 'fontFamily', 'href', 'imageSrc']);

    function record(delta) {
      // Drop redo branch
      stack = stack.slice(0, index + 1);
      // Coalesce with previous only if same id AND same kind, within 700ms,
      // AND the kind is one that benefits from coalescing (typing, sliders).
      const prev = stack[stack.length - 1];
      const now = Date.now();
      const canCoalesce = !NON_COALESCE.has(delta.kind);
      if (canCoalesce && prev && prev.id === delta.id && prev.kind === delta.kind && (now - prev.ts) < 700) {
        prev.after = delta.after;
        prev.ts = now;
      } else {
        stack.push({ ...delta, ts: now });
        if (stack.length > MAX) stack.shift();
      }
      index = stack.length - 1;
      notify();
    }

    function undo() {
      if (index < 0) return null;
      const entry = stack[index];
      index--;
      notify();
      return { kind: entry.kind, id: entry.id, value: entry.before };
    }

    function redo() {
      if (index >= stack.length - 1) return null;
      index++;
      const entry = stack[index];
      notify();
      return { kind: entry.kind, id: entry.id, value: entry.after };
    }

    function canUndo() { return index >= 0; }
    function canRedo() { return index < stack.length - 1; }

    function onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
    function notify() { for (const fn of listeners) fn(); }

    function reset() { stack = []; index = -1; notify(); }

    return { record, undo, redo, canUndo, canRedo, onChange, reset };
  })();

  // ─────────────────────────────────────────────
  // FileIO — read/download files
  // ─────────────────────────────────────────────
  const FileIO = (() => {
    function read(file) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error('No file provided.'));
        const name = (file.name || '').toLowerCase();
        if (!name.endsWith('.html') && !name.endsWith('.htm')) {
          return reject(new Error('Please choose a .html or .htm file.'));
        }
        const reader = new FileReader();
        reader.onload = () => resolve({ name: file.name, html: String(reader.result || '') });
        reader.onerror = () => reject(new Error('Could not read the file.'));
        reader.readAsText(file);
      });
    }

    function download(html, originalName) {
      const stem = (originalName || 'document.html').replace(/\.html?$/i, '');
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = stem + '-edited.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    return { read, download };
  })();

  // ─────────────────────────────────────────────
  // PreviewFrame — iframe controller
  // ─────────────────────────────────────────────
  const PreviewFrame = (() => {
    const iframe = document.getElementById('preview');
    const wrap = document.getElementById('preview-wrap');
    let bound = false;
    let editingEl = null;
    let editingBefore = '';

    const OVERLAY_CSS = `
      [data-edit-id]:not([contenteditable="true"]):hover {
        outline: 2px solid #4F46E5 !important;
        outline-offset: 2px !important;
        cursor: text !important;
        border-radius: 2px;
      }
      img[data-edit-id]:hover {
        cursor: pointer !important;
      }
      [data-edit-id][contenteditable="true"] {
        outline: 2px solid #4F46E5 !important;
        outline-offset: 2px !important;
        background: rgba(79, 70, 229, 0.04) !important;
        cursor: text !important;
        border-radius: 2px;
      }
      a[data-edit-id] { pointer-events: auto; }
    `;

    function render(onReady) {
      const html = DocModel.serializeForPreview();
      iframe.srcdoc = html;
      iframe.onload = () => {
        bindIframe();
        if (typeof onReady === 'function') onReady(iframe.contentDocument);
      };
    }

    function bindIframe() {
      const idoc = iframe.contentDocument;
      if (!idoc) return;

      // Inject overlay style (only in iframe, never in source doc)
      if (!idoc.getElementById('__editifact_overlay')) {
        const style = idoc.createElement('style');
        style.id = '__editifact_overlay';
        style.textContent = OVERLAY_CSS;
        (idoc.head || idoc.documentElement).appendChild(style);
      }

      // Bind once per iframe load
      idoc.addEventListener('click', onIframeClick, true);
      idoc.addEventListener('input', onIframeInput, true);
      idoc.addEventListener('blur', onIframeBlur, true);
      idoc.addEventListener('keydown', onIframeKeydown, true);
      bound = true;
    }

    function onIframeClick(e) {
      let el = e.target.closest && e.target.closest('[data-edit-id]');
      if (!el) return;
      // Walk up to the nearest element that's actually an item in the model —
      // shape candidates that didn't get promoted are tagged but uneditable.
      let id = el.getAttribute('data-edit-id');
      let item = DocModel.getItem(id);
      while (!item && el.parentElement) {
        el = el.parentElement.closest('[data-edit-id]');
        if (!el) break;
        id = el.getAttribute('data-edit-id');
        item = DocModel.getItem(id);
      }
      if (!item) return;

      e.preventDefault();
      e.stopPropagation();

      // Non-text items just focus the side panel row.
      if (item.type !== 'text') {
        App.notifyFocus(id, 'iframe');
        return;
      }
      if (el === editingEl) return;
      enterEditMode(el);
      App.notifyFocus(id, 'iframe');
    }

    function onIframeInput(e) {
      const el = e.target.closest && e.target.closest('[data-edit-id]');
      if (!el || !el.isContentEditable) return;
      const id = el.getAttribute('data-edit-id');
      DocModel.setText(id, el.textContent, { origin: 'iframe' });
    }

    function onIframeBlur(e) {
      const el = e.target.closest && e.target.closest('[data-edit-id]');
      if (!el || el !== editingEl) return;
      commitEdit(el);
    }

    function onIframeKeydown(e) {
      if (!editingEl) return;
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        editingEl.blur();
      } else if (e.key === 'Escape') {
        e.preventDefault();

        const id = editingEl.getAttribute('data-edit-id');
        DocModel.setText(id, editingBefore, { origin: 'iframe' });
        editingEl.textContent = editingBefore;
        editingEl.blur();
      }
    }

    function enterEditMode(el) {
      if (editingEl && editingEl !== el) commitEdit(editingEl);
      editingEl = el;
      editingBefore = el.textContent;
      el.setAttribute('contenteditable', 'true');
      el.focus();
      // Place caret at end
      const idoc = iframe.contentDocument;
      const range = idoc.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = idoc.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

    function focusBlock(id) {
      const idoc = iframe.contentDocument;
      if (!idoc) return;
      const el = idoc.querySelector('[data-edit-id="' + id + '"]');
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      // Brief highlight pulse
      el.style.transition = 'outline 0.2s ease';
      el.style.outline = '2px solid #4F46E5';
      el.style.outlineOffset = '2px';
      setTimeout(() => {
        el.style.outline = '';
        el.style.outlineOffset = '';
      }, 600);
    }

    function updateElementText(id, text) {
      const idoc = iframe.contentDocument;
      if (!idoc) return;
      const el = idoc.querySelector('[data-edit-id="' + id + '"]');
      if (!el) return;
      if (el === editingEl) return; // Don't clobber caret while typing
      if (el.textContent !== text) el.textContent = text;
    }

    function updateElementStyle(id, prop, value) {
      const idoc = iframe.contentDocument;
      if (!idoc) return;
      const el = idoc.querySelector('[data-edit-id="' + id + '"]');
      if (!el) return;
      if (value) el.style.setProperty(prop, value);
      else el.style.removeProperty(prop);
    }

    function updateElementAttr(id, attr, value) {
      const idoc = iframe.contentDocument;
      if (!idoc) return;
      const el = idoc.querySelector('[data-edit-id="' + id + '"]');
      if (!el) return;
      if (el.getAttribute(attr) !== value) el.setAttribute(attr, value);
    }

    function removeElement(id) {
      const idoc = iframe.contentDocument;
      if (!idoc) return;
      const el = idoc.querySelector('[data-edit-id="' + id + '"]');
      if (el) el.remove();
    }

    function moveElement(id, direction) {
      const idoc = iframe.contentDocument;
      if (!idoc) return;
      const el = idoc.querySelector('[data-edit-id="' + id + '"]');
      if (!el) return;
      const parent = el.parentNode;
      if (!parent) return;
      if (direction === 'up') {
        const prev = el.previousElementSibling;
        if (prev) parent.insertBefore(el, prev);
      } else if (direction === 'down') {
        const next = el.nextElementSibling;
        if (next) parent.insertBefore(el, next.nextSibling);
      }
    }

    function updateIconColor(id, color) {
      const idoc = iframe.contentDocument;
      if (!idoc) return;
      const el = idoc.querySelector('[data-edit-id="' + id + '"]');
      if (!el) return;
      if (color) {
        el.style.color = color;
        el.setAttribute('fill', color);
        const fillables = el.querySelectorAll('path, circle, polygon, rect, ellipse, line, polyline');
        for (const c of fillables) {
          if (c.getAttribute('fill') && c.getAttribute('fill') !== 'none') c.setAttribute('fill', color);
        }
      } else {
        el.style.removeProperty('color');
        el.removeAttribute('fill');
      }
    }

    function setDevice(mode) {
      wrap.setAttribute('data-device', mode);
    }

    return { render, focusBlock, updateElementText, updateElementStyle, updateElementAttr, updateIconColor, removeElement, moveElement, setDevice };
  })();
