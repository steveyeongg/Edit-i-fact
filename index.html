        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>'
      },
      {
        type: 'icon',
        title: 'Icons',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg>'
      },
      {
        type: 'image',
        title: 'Images',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'
      }
    ];

    function render() {
      const items = DocModel.list();
      listEl.innerHTML = '';
      rowById = new Map();
      sectionHeaderByType = {};
      countEl.textContent = items.length;

      // Partition items into groups, preserving document order within each.
      const groups = { text: [], shape: [], icon: [], image: [] };
      for (const item of items) {
        if (groups[item.type]) groups[item.type].push(item);
      }

      const frag = document.createDocumentFragment();
      for (const def of SECTION_DEFS) {
        const group = groups[def.type];
        if (!group.length) continue;

        const header = buildSectionHeader(def, group.length);
        sectionHeaderByType[def.type] = header;
        frag.appendChild(header);

        for (const item of group) {
          let entry;
          if (def.type === 'text') entry = buildTextRow(item);
          else if (def.type === 'shape') entry = buildShapeRow(item);
          else if (def.type === 'icon') entry = buildIconRow(item);
          else entry = buildImageRow(item);
          rowById.set(item.id, entry);
          frag.appendChild(entry.row);
        }
      }
      listEl.appendChild(frag);
      runSearch(searchInput.value || '');
    }

    function buildSectionHeader(def, count) {
      const header = document.createElement('div');
      header.className = 'panel-section';
      header.dataset.type = def.type;
      header.setAttribute('role', 'button');
      header.setAttribute('tabindex', '0');
      header.setAttribute('aria-expanded', String(!!expandedByType[def.type]));
      header.setAttribute('aria-label', def.title + ' — click to collapse or expand');
      header.innerHTML =
        '<span class="panel-section-title">' +
          CHEVRON_SVG +
          '<span class="panel-section-icon">' + def.icon + '</span>' +
          def.title +
        '</span>' +
        '<span class="panel-section-count">' + count + '</span>';
      header.addEventListener('click', () => toggleSection(def.type));
      header.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleSection(def.type);
        }
      });
      return header;
    }

    function toggleSection(type) {
      expandedByType[type] = !expandedByType[type];
      runSearch(searchInput.value || '');
    }

    function buildTextRow(item) {
      const row = document.createElement('div');
      row.className = 'block-item';
      row.setAttribute('role', 'listitem');
      row.dataset.id = item.id;
      row.dataset.type = 'text';

      const meta = document.createElement('div');
      meta.className = 'block-meta';
      const tag = document.createElement('span');
      tag.className = 'block-tag tag-' + item.tag.toLowerCase();
      tag.textContent = item.tag;
      meta.appendChild(tag);
      const spacer = document.createElement('span');
      spacer.className = 'block-meta-spacer';
      meta.appendChild(spacer);

      // Text color picker
      const textColor = makeColorPicker({
        title: 'Text color',
        labelText: 'A',
        initial: item.color,
        onChange: (val) => DocModel.setColor(item.id, val, { origin: 'panel' }),
        onClear: () => DocModel.setColor(item.id, '', { origin: 'panel' })
      });
      meta.appendChild(textColor.control);

      // Background color picker
      const bgColor = makeColorPicker({
        title: 'Background color',
        labelText: '',
        solid: true,
        initial: item.bgColor,
        onChange: (val) => DocModel.setBgColor(item.id, val, { origin: 'panel' }),
        onClear: () => DocModel.setBgColor(item.id, '', { origin: 'panel' })
      });
      meta.appendChild(bgColor.control);

      // Row actions (up / down / delete)
      meta.appendChild(buildRowActions(item));

      const textarea = document.createElement('textarea');
      textarea.className = 'block-text';
      textarea.value = item.text;
      textarea.rows = 1;
      textarea.spellcheck = true;
      autoSize(textarea);

      textarea.addEventListener('input', () => {
        autoSize(textarea);
        DocModel.setText(item.id, textarea.value, { origin: 'panel' });
      });
      textarea.addEventListener('focus', () => {
        setActive(item.id);
        App.notifyFocus(item.id, 'panel');
      });

      row.appendChild(meta);
      row.appendChild(textarea);

      // Font family dropdown
      const fontRow = document.createElement('div');
      fontRow.className = 'extras-row';
      const fontLabel = document.createElement('span');
      fontLabel.className = 'extras-label';
      fontLabel.textContent = 'Font';
      const fontSelect = makeFontSelect(item);
      fontRow.appendChild(fontLabel);
      fontRow.appendChild(fontSelect);
      row.appendChild(fontRow);

      // Font size slider
      const sizeRow = makeStyleRow('Size');
      const fontSizeSlider = document.createElement('input');
      fontSizeSlider.type = 'range';
      fontSizeSlider.min = '8';
      fontSizeSlider.max = '96';
      fontSizeSlider.step = '1';
      fontSizeSlider.value = String(Math.round(item.fontSize || 16));
      fontSizeSlider.className = 'radius-slider';
      const fontSizeValue = document.createElement('span');
      fontSizeValue.className = 'style-value';
      fontSizeValue.textContent = Math.round(item.fontSize || 16) + 'px';
      fontSizeSlider.addEventListener('input', () => {
        fontSizeValue.textContent = fontSizeSlider.value + 'px';
        DocModel.setFontSize(item.id, +fontSizeSlider.value, { origin: 'panel' });
      });
      sizeRow.body.appendChild(fontSizeSlider);
      sizeRow.body.appendChild(fontSizeValue);
      row.appendChild(sizeRow.row);

      // Essential typography controls are based on computed styles, so they
      // work even when the source file formats text through CSS classes.
      const weightRow = makeStyleRow('Weight');
      const weightSelect = makeSelectControl([
        ['300', 'Light'], ['400', 'Regular'], ['500', 'Medium'],
        ['600', 'Semibold'], ['700', 'Bold'], ['800', 'Extra bold'], ['900', 'Black']
      ], String(item.fontWeight || '400'), (value) => {
        DocModel.setFontWeight(item.id, value, { origin: 'panel' });
      });
      weightRow.body.appendChild(weightSelect);
      row.appendChild(weightRow.row);

      const alignRow = makeStyleRow('Align');
      const alignSelect = makeSelectControl([
        ['left', 'Left'], ['center', 'Centre'], ['right', 'Right'], ['justify', 'Justify']
      ], item.textAlign || 'left', (value) => {
        DocModel.setTextAlign(item.id, value, { origin: 'panel' });
      });
      alignRow.body.appendChild(alignSelect);
      row.appendChild(alignRow.row);

      const lineHeightRow = makeStyleRow('Line');
      const lineHeightSlider = makeRangeControl(0.8, 3, 0.05, item.lineHeight || 1.4, '×', (value) => {
        DocModel.setLineHeight(item.id, value, { origin: 'panel' });
      });
      lineHeightRow.body.appendChild(lineHeightSlider.control);
      row.appendChild(lineHeightRow.row);

      const trackingRow = makeStyleRow('Spacing');
      const trackingSlider = makeRangeControl(-2, 12, 0.25, item.letterSpacing || 0, 'px', (value) => {
        DocModel.setLetterSpacing(item.id, value, { origin: 'panel' });
      });
      trackingRow.body.appendChild(trackingSlider.control);
      row.appendChild(trackingRow.row);

      const opacityRow = makeStyleRow('Opacity');
      const opacitySlider = makeRangeControl(0, 1, 0.05, item.opacity == null ? 1 : item.opacity, '%', (value) => {
        DocModel.setOpacity(item.id, value, { origin: 'panel' });
      }, true);
      opacityRow.body.appendChild(opacitySlider.control);
      row.appendChild(opacityRow.row);

      // A text node may also be the visible card, pill, badge or table cell.
      // Expose its box formatting here rather than forcing users to hunt for
      // a separate wrapper that may not exist in AI-generated markup.
      const textBorderRow = makeStyleRow('Border');
      const textBorderPicker = makeColorPicker({
        title: 'Border color', labelText: '', solid: true, initial: item.borderColor,
        onChange: (value) => DocModel.setBorderColor(item.id, value, { origin: 'panel' }),
        onClear: () => DocModel.setBorderColor(item.id, '', { origin: 'panel' })
      });
      textBorderRow.body.appendChild(textBorderPicker.control);
      row.appendChild(textBorderRow.row);

      const textRadiusRow = makeStyleRow('Corners');
      const textRadiusSlider = makeRangeControl(0, 48, 1, item.borderRadius || 0, 'px', (value) => {
        DocModel.setBorderRadius(item.id, value, { origin: 'panel' });
      });
      textRadiusRow.body.appendChild(textRadiusSlider.control);
      row.appendChild(textRadiusRow.row);

      // Link href (for <a> elements only)
      let hrefInput = null;
      if (item.tag === 'A') {
        const hrefRow = document.createElement('div');
        hrefRow.className = 'extras-row';
        const hrefLabel = document.createElement('span');
        hrefLabel.className = 'extras-label';
        hrefLabel.textContent = 'Link';
        hrefInput = makeHrefInput(item);
        hrefRow.appendChild(hrefLabel);
        hrefRow.appendChild(hrefInput);
        row.appendChild(hrefRow);
      }

      row.addEventListener('click', (e) => {
        if (e.target === textarea) return;
        if (e.target.closest('.color-control, .row-actions, .font-select, .href-input, .extras-row, .style-row, input, button, label')) return;
        textarea.focus();
      });

      return { row, textarea, textColor, bgColor, fontSelect, fontSizeSlider, fontSizeValue,
        weightSelect, alignSelect, lineHeightSlider, trackingSlider, opacitySlider,
        textBorderPicker, textRadiusSlider, hrefInput };
    }

    // Curated font family choices. Empty string = inherit (reset).
    const FONT_FAMILIES = [
      { label: 'Default', value: '' },
      { label: 'Sans-serif', value: '-apple-system, "Inter", system-ui, sans-serif' },
      { label: 'Serif', value: 'Georgia, "Iowan Old Style", "Times New Roman", serif' },
      { label: 'Display serif', value: '"Instrument Serif", Georgia, serif' },
      { label: 'Mono', value: 'ui-monospace, "SF Mono", Menlo, monospace' },
      { label: 'Rounded', value: '"SF Pro Rounded", "Nunito", system-ui, sans-serif' }
    ];

    function buildRowActions(item) {
      const wrap = document.createElement('span');
      wrap.className = 'row-actions';

      const up = makeIconButton('Move up', 'up',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>');
      const down = makeIconButton('Move down', '',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
      const del = makeIconButton('Delete', 'danger',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>');

      up.disabled = !DocModel.canMove(item.id, 'up');
      down.disabled = !DocModel.canMove(item.id, 'down');

      up.addEventListener('click', (e) => {
        e.stopPropagation();
        DocModel.moveItem(item.id, 'up', { origin: 'panel' });
      });
      down.addEventListener('click', (e) => {
        e.stopPropagation();
        DocModel.moveItem(item.id, 'down', { origin: 'panel' });
      });
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        const label = item.type === 'text' ? item.tag :
                      item.type === 'shape' ? (item.label || 'shape') :
                      item.type === 'icon' ? 'icon' : 'image';
        if (window.confirm('Delete this ' + label + '? You can undo it with ⌘Z / Ctrl+Z.')) {
          DocModel.deleteItem(item.id, { origin: 'panel' });
        }
      });

      wrap.appendChild(up);
      wrap.appendChild(down);
      wrap.appendChild(del);
      return wrap;
    }

    function makeIconButton(title, extraClass, svgHtml) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'row-action' + (extraClass ? ' ' + extraClass : '');
      btn.title = title;
      btn.setAttribute('aria-label', title);
      btn.innerHTML = svgHtml;
      return btn;
    }

    function makeFontSelect(item) {
      const select = document.createElement('select');
      select.className = 'font-select';
      const current = item.fontFamily || '';
      let matched = false;
      for (const f of FONT_FAMILIES) {
        const opt = document.createElement('option');
        opt.value = f.value;
        opt.textContent = f.label;
        if (f.value === current) { opt.selected = true; matched = true; }
        select.appendChild(opt);
      }
      // If the item already has a custom font that's not in our list, add a
      // synthetic option so the dropdown reflects reality.
      if (!matched && current) {
        const opt = document.createElement('option');
        opt.value = current;
        opt.textContent = 'Custom';
        opt.selected = true;
        select.insertBefore(opt, select.firstChild.nextSibling);
      }
      select.addEventListener('change', () => {
        DocModel.setFontFamily(item.id, select.value, { origin: 'panel' });
      });
      return select;
    }

    function makeHrefInput(item) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'href-input';
      input.placeholder = 'https://…';
      input.value = item.href || '';
      input.spellcheck = false;
      input.addEventListener('input', () => {
        DocModel.setHref(item.id, input.value, { origin: 'panel' });
      });
      return input;
    }

    function makeSelectControl(options, selected, onChange) {
      const select = document.createElement('select');
      select.className = 'font-select style-select';
      for (const [value, label] of options) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        option.selected = String(value) === String(selected);
        select.appendChild(option);
      }
      select.addEventListener('change', () => onChange(select.value));
      return select;
    }

    function makeRangeControl(min, max, step, initial, suffix, onChange, percentValue) {
      const control = document.createElement('span');
      control.className = 'style-row-body range-control';
      const input = document.createElement('input');
      input.type = 'range';
      input.min = String(min);
      input.max = String(max);
      input.step = String(step);
      input.value = String(Math.max(Number(min), Math.min(Number(max), Number(initial))));
      input.className = 'radius-slider';
      const value = document.createElement('span');
      value.className = 'style-value';
      const display = () => percentValue
        ? Math.round(Number(input.value) * 100) + suffix
        : Number(input.value).toFixed(step < 1 ? String(step).split('.')[1].length : 0).replace(/\.0+$/, '') + suffix;
      value.textContent = display();
      input.addEventListener('input', () => {
        value.textContent = display();
        onChange(Number(input.value));
      });
      control.appendChild(input);
      control.appendChild(value);
      return { control, input, value, suffix, percentValue: !!percentValue };
    }

    function makeColorPicker(opts) {
      const control = document.createElement('span');
      control.className = 'color-control';
      const label = document.createElement('label');
      label.title = opts.title || '';
      if (opts.solid) label.classList.add('solid');
      if (opts.labelText) label.textContent = opts.labelText;
      const input = document.createElement('input');
      input.type = 'color';
      input.value = normalizeColor(opts.initial) || '#000000';
      label.appendChild(input);
      const clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'color-clear';
      clear.textContent = '×';
      clear.title = 'Reset';
      clear.hidden = !opts.initial;
      applyColorSwatch(label, opts.initial, opts.solid);
      control.appendChild(label);
      control.appendChild(clear);

      input.addEventListener('input', () => {
        if (opts.onChange) opts.onChange(input.value);
      });
      clear.addEventListener('click', () => {
        if (opts.onClear) opts.onClear();
      });

      return { control, label, input, clear, solid: !!opts.solid };
    }

    function buildShapeRow(item) {
      const row = document.createElement('div');
      row.className = 'block-item';
      row.dataset.id = item.id;
      row.dataset.type = 'shape';

      const meta = document.createElement('div');
      meta.className = 'block-meta';
      const tag = document.createElement('span');
      tag.className = 'block-tag tag-shape';
      tag.textContent = item.label || item.tag;
      tag.title = item.label || item.tag;
      meta.appendChild(tag);
      const spacer = document.createElement('span');
      spacer.className = 'block-meta-spacer';
      meta.appendChild(spacer);
      meta.appendChild(buildRowActions(item));

      const shapeControls = document.createElement('div');
      shapeControls.className = 'shape-controls';

      // Fill (background) row
      const fillRow = makeStyleRow('Fill');
      const fillPicker = makeColorPicker({
        title: 'Background color',
        labelText: '',
        solid: true,
        initial: item.bgColor,
        onChange: (val) => DocModel.setBgColor(item.id, val, { origin: 'panel' }),
        onClear: () => DocModel.setBgColor(item.id, '', { origin: 'panel' })
      });
      fillRow.body.appendChild(fillPicker.control);
      shapeControls.appendChild(fillRow.row);

      // Border row
      const borderRow = makeStyleRow('Border');
      const borderPicker = makeColorPicker({
        title: 'Border color',
        labelText: '',
        solid: true,
        initial: item.borderColor,
        onChange: (val) => DocModel.setBorderColor(item.id, val, { origin: 'panel' }),
        onClear: () => DocModel.setBorderColor(item.id, '', { origin: 'panel' })
      });
      borderRow.body.appendChild(borderPicker.control);
      shapeControls.appendChild(borderRow.row);

      const borderWidthRow = makeStyleRow('Border px');
      const borderWidthSlider = makeRangeControl(0, 12, 1, item.borderWidth || 0, 'px', (value) => {
        DocModel.setBorderWidth(item.id, value, { origin: 'panel' });
      });
      borderWidthRow.body.appendChild(borderWidthSlider.control);
      shapeControls.appendChild(borderWidthRow.row);

      const borderStyleRow = makeStyleRow('Border');
      const borderStyleSelect = makeSelectControl([
        ['solid', 'Solid'], ['dashed', 'Dashed'], ['dotted', 'Dotted'], ['double', 'Double']
      ], item.borderStyle || 'solid', (value) => {
        DocModel.setBorderStyle(item.id, value, { origin: 'panel' });
      });
      borderStyleRow.body.appendChild(borderStyleSelect);
      shapeControls.appendChild(borderStyleRow.row);

      // Radius row
      const radiusRow = makeStyleRow('Radius');
      const radiusSlider = document.createElement('input');
      radiusSlider.type = 'range';
      radiusSlider.min = '0';
      radiusSlider.max = '48';
      radiusSlider.value = String(Math.round(item.borderRadius || 0));
      radiusSlider.className = 'radius-slider';
      const radiusValue = document.createElement('span');
      radiusValue.className = 'style-value';
      radiusValue.textContent = (Math.round(item.borderRadius || 0)) + 'px';
      radiusSlider.addEventListener('input', () => {
        radiusValue.textContent = radiusSlider.value + 'px';
        DocModel.setBorderRadius(item.id, +radiusSlider.value, { origin: 'panel' });
      });
      radiusRow.body.appendChild(radiusSlider);
      radiusRow.body.appendChild(radiusValue);
      shapeControls.appendChild(radiusRow.row);

      // Padding row
      const paddingRow = makeStyleRow('Padding');
      const paddingSlider = document.createElement('input');
      paddingSlider.type = 'range';
      paddingSlider.min = '0';
      paddingSlider.max = '64';
      paddingSlider.value = String(Math.round(item.padding || 0));
      paddingSlider.className = 'radius-slider';
      const paddingValue = document.createElement('span');
      paddingValue.className = 'style-value';
      paddingValue.textContent = (Math.round(item.padding || 0)) + 'px';
      paddingSlider.addEventListener('input', () => {
        paddingValue.textContent = paddingSlider.value + 'px';
        DocModel.setPadding(item.id, +paddingSlider.value, { origin: 'panel' });
      });
      paddingRow.body.appendChild(paddingSlider);
      paddingRow.body.appendChild(paddingValue);
      shapeControls.appendChild(paddingRow.row);

      const shadowRow = makeStyleRow('Shadow');
      const shadowOptions = [
        ['', 'None'],
        ['0 1px 3px rgba(15,23,42,.12)', 'Soft'],
        ['0 8px 18px rgba(15,23,42,.16)', 'Medium'],
        ['0 18px 36px rgba(15,23,42,.22)', 'Strong']
      ];
      const matchingShadow = shadowOptions.some(([value]) => value === item.boxShadow);
      const shadowSelect = makeSelectControl(shadowOptions, matchingShadow ? item.boxShadow : '', (value) => {
        DocModel.setBoxShadow(item.id, value, { origin: 'panel' });
      });
      if (item.boxShadow && !matchingShadow) {
        const custom = document.createElement('option');
        custom.value = item.boxShadow;
        custom.textContent = 'Original shadow';
        custom.selected = true;
        shadowSelect.insertBefore(custom, shadowSelect.firstChild.nextSibling);
      }
      shadowRow.body.appendChild(shadowSelect);
      shapeControls.appendChild(shadowRow.row);

      const opacityRow = makeStyleRow('Opacity');
      const opacitySlider = makeRangeControl(0, 1, 0.05, item.opacity == null ? 1 : item.opacity, '%', (value) => {
        DocModel.setOpacity(item.id, value, { origin: 'panel' });
      }, true);
      opacityRow.body.appendChild(opacitySlider.control);
      shapeControls.appendChild(opacityRow.row);

      row.appendChild(meta);
      row.appendChild(shapeControls);
      row.addEventListener('click', (e) => {
        if (e.target.closest('input, button, label')) return;
        setActive(item.id);
        App.notifyFocus(item.id, 'panel');
      });

      return { row, fillPicker, borderPicker, borderWidthSlider, borderStyleSelect,
        radiusSlider, radiusValue, paddingSlider, paddingValue, shadowSelect, opacitySlider };
    }

    function buildIconRow(item) {
      const row = document.createElement('div');
      row.className = 'block-item';
      row.dataset.id = item.id;
      row.dataset.type = 'icon';

      const meta = document.createElement('div');
      meta.className = 'block-meta';
      const tag = document.createElement('span');
      tag.className = 'block-tag tag-icon-svg';
      tag.textContent = 'SVG';
      meta.appendChild(tag);
      const iconSpacer = document.createElement('span');
      iconSpacer.className = 'block-meta-spacer';
      meta.appendChild(iconSpacer);
      meta.appendChild(buildRowActions(item));

      const iconRow = document.createElement('div');
      iconRow.className = 'icon-row';

      // Preview
      const preview = document.createElement('div');
      preview.className = 'icon-preview';
      // Clone the source SVG into the preview (already small).
      const sourceEl = DocModel.getElement(item.id);
      if (sourceEl) {
        const clone = sourceEl.cloneNode(true);
        clone.removeAttribute('data-edit-id');
        preview.appendChild(clone);
      }
      iconRow.appendChild(preview);

      // Color picker
      const styleBody = document.createElement('div');
      styleBody.className = 'icon-controls';
      const label = document.createElement('span');
      label.className = 'style-label';
      label.textContent = 'Color';
      const colorPicker = makeColorPicker({
        title: 'Icon color',
        labelText: '',
        solid: true,
        initial: item.color,
        onChange: (val) => DocModel.setIconColor(item.id, val, { origin: 'panel' }),
        onClear: () => DocModel.setIconColor(item.id, '', { origin: 'panel' })
      });
      styleBody.appendChild(label);
      styleBody.appendChild(colorPicker.control);
      iconRow.appendChild(styleBody);

      row.appendChild(meta);
      row.appendChild(iconRow);
      row.addEventListener('click', (e) => {
        if (e.target.closest('input, button, label')) return;
        setActive(item.id);
        App.notifyFocus(item.id, 'panel');
      });

      return { row, colorPicker, preview };
    }

    function makeStyleRow(label) {
      const row = document.createElement('div');
      row.className = 'style-row';
      const lbl = document.createElement('span');
      lbl.className = 'style-label';
      lbl.textContent = label;
      const body = document.createElement('span');
      body.className = 'style-row-body';
      row.appendChild(lbl);
      row.appendChild(body);
      return { row, body };
    }

    function buildImageRow(item) {
      const row = document.createElement('div');
      row.className = 'block-item';
      row.setAttribute('role', 'listitem');
      row.dataset.id = item.id;
      row.dataset.type = 'image';

      const meta = document.createElement('div');
      meta.className = 'block-meta';
      const tag = document.createElement('span');
      tag.className = 'block-tag tag-img';
      tag.textContent = 'IMG';
      meta.appendChild(tag);
      const imgSpacer = document.createElement('span');
      imgSpacer.className = 'block-meta-spacer';
      meta.appendChild(imgSpacer);
      meta.appendChild(buildRowActions(item));

      const wrap = document.createElement('div');
      wrap.className = 'image-row';
      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'image-thumb-wrap';
      const thumb = document.createElement('img');
      thumb.alt = '';
      thumb.src = item.src;
      thumb.addEventListener('error', () => { thumb.style.display = 'none'; });
      thumbWrap.appendChild(thumb);

      const controls = document.createElement('div');
      controls.className = 'image-controls';
      const altInput = document.createElement('input');
      altInput.type = 'text';
      altInput.placeholder = 'Alt text…';
      altInput.value = item.alt || '';
      altInput.spellcheck = true;
      const replaceBtn = document.createElement('button');
      replaceBtn.type = 'button';
      replaceBtn.className = 'btn-replace';
      replaceBtn.textContent = 'Replace image…';
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.hidden = true;

      controls.appendChild(altInput);
      controls.appendChild(replaceBtn);
      controls.appendChild(fileInput);
      wrap.appendChild(thumbWrap);
      wrap.appendChild(controls);

      altInput.addEventListener('input', () => {
        DocModel.setImageAlt(item.id, altInput.value, { origin: 'panel' });
      });
      altInput.addEventListener('focus', () => {
        setActive(item.id);
        App.notifyFocus(item.id, 'panel');
      });
      replaceBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const dataUrl = await readAsDataUrl(file);
          DocModel.setImageSrc(item.id, dataUrl, { origin: 'panel' });
          App.toast('Image replaced', 'success');
        } catch (err) {
          App.toast('Could not read image', 'error');
        }
        fileInput.value = '';
      });

      row.appendChild(meta);
      row.appendChild(wrap);
      row.addEventListener('click', (e) => {
        if (e.target === altInput || e.target === replaceBtn) return;
        setActive(item.id);
        App.notifyFocus(item.id, 'panel');
      });

      return { row, altInput, thumb };
    }

    function readAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('read failed'));
        reader.readAsDataURL(file);
      });
    }

    function normalizeColor(input) {
      if (!input) return '';
      const s = String(input).trim();
      if (!s) return '';
      if (/^#[0-9a-f]{6}$/i.test(s)) return s;
      // Use a probe element to coerce rgb/named colors to a canonical form,
      // then convert to hex for the native color input.
      const probe = document.createElement('span');
      probe.style.color = s;
      document.body.appendChild(probe);
      const computed = getComputedStyle(probe).color;
      probe.remove();
      const m = computed.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
      if (!m) return '';
      const r = (+m[1]).toString(16).padStart(2, '0');
      const g = (+m[2]).toString(16).padStart(2, '0');
      const b = (+m[3]).toString(16).padStart(2, '0');
      return '#' + r + g + b;
    }

    function applyColorSwatch(labelEl, color, solid) {
      labelEl.style.setProperty('--color-swatch', color || 'transparent');
      if (solid) {
        if (color) labelEl.style.setProperty('background', color);
        else labelEl.style.removeProperty('background');
      }
    }

    function autoSize(ta) {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight + 2, 280) + 'px';
      ta.style.overflow = ta.scrollHeight > 280 ? 'auto' : 'hidden';
    }

    function focusBlock(id) {
      const entry = rowById.get(id);
      if (!entry) return;

      // Expand the section if collapsed, so the row is visible before we
      // try to scroll it into view.
      const item = DocModel.getItem(id);
      if (item && !expandedByType[item.type]) {
        expandedByType[item.type] = true;
        runSearch(searchInput.value || '');
      }

      entry.row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      setActive(id);

      // Brief pulse to signal "we navigated here" — restart the animation
      // by removing + forcing reflow + re-adding the class.
      entry.row.classList.remove('focus-pulse');
      void entry.row.offsetWidth;
      entry.row.classList.add('focus-pulse');
      setTimeout(() => entry.row.classList.remove('focus-pulse'), 900);
    }

    function setActive(id) {
      if (activeId === id) return;
      if (activeId) {
        const prev = rowById.get(activeId);
        if (prev) prev.row.classList.remove('active');
      }
      activeId = id;
      const cur = rowById.get(id);
      if (cur) cur.row.classList.add('active');
    }

    function updateItemText(id, text) {
      const entry = rowById.get(id);
      if (!entry || !entry.textarea) return;
      if (document.activeElement === entry.textarea) return;
      if (entry.textarea.value !== text) {
        entry.textarea.value = text;
        autoSize(entry.textarea);
      }
    }

    function syncPicker(picker, color) {
      if (!picker) return;
      const hex = normalizeColor(color) || '#000000';
      if (picker.input.value !== hex) picker.input.value = hex;
      applyColorSwatch(picker.label, color, picker.solid);
      picker.clear.hidden = !color;
    }

    function updateItemColor(id, color) {
      const entry = rowById.get(id);
      if (!entry) return;
      syncPicker(entry.textColor, color);
    }

    function updateItemBgColor(id, color) {
      const entry = rowById.get(id);
      if (!entry) return;
      // Text rows and shape rows both have a fill picker.
      syncPicker(entry.bgColor || entry.fillPicker, color);
    }

    function updateItemBorderColor(id, color) {
      const entry = rowById.get(id);
      if (!entry) return;
      syncPicker(entry.borderPicker || entry.textBorderPicker, color);
    }

    function updateItemBorderRadius(id, radius) {
      const entry = rowById.get(id);
      if (!entry) return;
      if (entry.radiusSlider) {
        if (document.activeElement === entry.radiusSlider) return;
        entry.radiusSlider.value = String(Math.round(radius));
        entry.radiusValue.textContent = Math.round(radius) + 'px';
      } else {
        syncRange(entry.textRadiusSlider, radius);
      }
    }

    function updateItemIconColor(id, color) {
      const entry = rowById.get(id);
      if (!entry) return;
      syncPicker(entry.colorPicker, color);
    }

    function updateItemHref(id, href) {
      const entry = rowById.get(id);
      if (!entry || !entry.hrefInput) return;
      if (document.activeElement === entry.hrefInput) return;
      if (entry.hrefInput.value !== href) entry.hrefInput.value = href;
    }

    function updateItemFontFamily(id, fontFamily) {
      const entry = rowById.get(id);
      if (!entry || !entry.fontSelect) return;
      // If the value isn't in the existing options, add a "Custom" option.
      const select = entry.fontSelect;
      let found = false;
      for (const opt of select.options) {
        if (opt.value === fontFamily) { opt.selected = true; found = true; break; }
      }
      if (!found && fontFamily) {
        const opt = document.createElement('option');
        opt.value = fontFamily;
        opt.textContent = 'Custom';
        opt.selected = true;
        select.insertBefore(opt, select.firstChild.nextSibling);
      }
    }

    function updateItemFontSize(id, fontSize) {
      const entry = rowById.get(id);
      if (!entry || !entry.fontSizeSlider) return;
      if (document.activeElement === entry.fontSizeSlider) return;
      const value = Math.round(fontSize || 16);
      entry.fontSizeSlider.value = String(value);
      entry.fontSizeValue.textContent = value + 'px';
    }

    function updateItemPadding(id, padding) {
      const entry = rowById.get(id);
      if (!entry || !entry.paddingSlider) return;
      if (document.activeElement === entry.paddingSlider) return;
      entry.paddingSlider.value = String(Math.round(padding));
      entry.paddingValue.textContent = Math.round(padding) + 'px';
    }

    function syncRange(control, value) {
      if (!control || document.activeElement === control.input) return;
      control.input.value = String(value);
      control.value.textContent = control.percentValue
        ? Math.round(Number(value) * 100) + control.suffix
        : Number(value).toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1') + control.suffix;
    }

    function updateItemStyle(id, kind, value) {
      const entry = rowById.get(id);
      if (!entry) return;
      if (kind === 'fontWeight' && entry.weightSelect) entry.weightSelect.value = String(value);
      else if (kind === 'textAlign' && entry.alignSelect) entry.alignSelect.value = value;
      else if (kind === 'lineHeight') syncRange(entry.lineHeightSlider, value);
      else if (kind === 'letterSpacing') syncRange(entry.trackingSlider, value);
      else if (kind === 'opacity') syncRange(entry.opacitySlider, value);
      else if (kind === 'borderWidth') syncRange(entry.borderWidthSlider, value);
      else if (kind === 'borderStyle' && entry.borderStyleSelect) entry.borderStyleSelect.value = value;
      else if (kind === 'boxShadow' && entry.shadowSelect) entry.shadowSelect.value = value;
    }

    function updateItemImageSrc(id, src) {
      const entry = rowById.get(id);
      if (!entry || !entry.thumb) return;
      if (entry.thumb.getAttribute('src') !== src) entry.thumb.setAttribute('src', src);
    }

    function updateItemImageAlt(id, alt) {
      const entry = rowById.get(id);
      if (!entry || !entry.altInput) return;
      if (document.activeElement === entry.altInput) return;
      if (entry.altInput.value !== alt) entry.altInput.value = alt;
    }

    function runSearch(query) {
      const q = (query || '').trim().toLowerCase();
      matchCountEl.textContent = '';
      let matches = 0;
      const items = DocModel.list();
      const searchActive = q.length > 0;
      const matchedByType = { text: 0, shape: 0, icon: 0, image: 0 };

      for (const item of items) {
        const entry = rowById.get(item.id);
        if (!entry) continue;
        // Search filter
        let passesSearch;
        if (!searchActive) {
          passesSearch = true;
        } else if (item.type !== 'text') {
          // Image rows can't be searched by text — hide while a query is active.
          passesSearch = false;
        } else {
          passesSearch = item.text.toLowerCase().includes(q);
          if (passesSearch) matches++;
        }
        entry.row.classList.toggle('hidden-by-search', !passesSearch);
        // Collapse filter — active search forces sections expanded.
        const expanded = searchActive ? true : expandedByType[item.type];
        entry.row.classList.toggle('hidden-by-collapse', !expanded);
        if (passesSearch) matchedByType[item.type]++;
      }

      // Section header visibility + collapsed appearance
      for (const def of SECTION_DEFS) {
        const header = sectionHeaderByType[def.type];
        if (!header) continue;
        header.classList.toggle('hidden-by-search', matchedByType[def.type] === 0);
        const showAsExpanded = searchActive ? true : expandedByType[def.type];
        header.classList.toggle('collapsed', !showAsExpanded);
        header.setAttribute('aria-expanded', String(showAsExpanded));
      }

      if (q) matchCountEl.textContent = matches + (matches === 1 ? ' match' : ' matches');
    }

    function replaceOne() {
      const q = searchInput.value;
      const r = replaceInput.value;
      if (!q) return;
      const items = DocModel.list();
      const lower = q.toLowerCase();
      for (const item of items) {
        if (item.type !== 'text') continue;
        const i = item.text.toLowerCase().indexOf(lower);
        if (i >= 0) {
          const next = item.text.slice(0, i) + r + item.text.slice(i + q.length);
          DocModel.setText(item.id, next, { origin: 'replace' });
          App.toast('Replaced 1 match', 'success');
          return;
        }
      }
      App.toast('No matches found', 'error');
    }

    function replaceAll() {
      const q = searchInput.value;
      const r = replaceInput.value;
      if (!q) return;
      const items = DocModel.list();
      const lower = q.toLowerCase();
      let total = 0;
      for (const item of items) {
        if (item.type !== 'text') continue;
        if (!item.text.toLowerCase().includes(lower)) continue;
        const re = new RegExp(escapeRegex(q), 'gi');
        const matches = item.text.match(re);
        if (!matches) continue;
        const next = item.text.replace(re, r);
        DocModel.setText(item.id, next, { origin: 'replace' });
        total += matches.length;
      }
      if (total === 0) App.toast('No matches found', 'error');
      else App.toast('Replaced ' + total + (total === 1 ? ' match' : ' matches'), 'success');
    }

    function escapeRegex(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function reset() {
      listEl.innerHTML = '';
      rowById = new Map();
      activeId = null;
      countEl.textContent = '0';
      searchInput.value = '';
      replaceInput.value = '';
      matchCountEl.textContent = '';
      syncClearButton();
    }

    function syncClearButton() {
      searchClearBtn.classList.toggle('visible', searchInput.value.length > 0);
    }

    // Wire search/replace
    searchInput.addEventListener('input', () => {
      syncClearButton();
      runSearch(searchInput.value);
    });
    searchClearBtn.addEventListener('mousedown', (e) => {
      // mousedown (not click) so we run before any focus shift, and the
      // input keeps focus after clearing.
      e.preventDefault();
      searchInput.value = '';
      syncClearButton();
      runSearch('');
      searchInput.focus();
    });
    replaceOneBtn.addEventListener('click', replaceOne);
    replaceAllBtn.addEventListener('click', replaceAll);

    return {
      render, focusBlock, runSearch, reset,
      updateItemText, updateItemColor,
      updateItemBgColor, updateItemBorderColor, updateItemBorderRadius, updateItemPadding,
      updateItemIconColor,
      updateItemImageSrc, updateItemImageAlt,
      updateItemHref, updateItemFontFamily, updateItemFontSize, updateItemStyle
    };
  })();

  // ─────────────────────────────────────────────
  // App — glue
  // ─────────────────────────────────────────────
  const App = (() => {
    const els = {
      emptyState: document.getElementById('empty-state'),
      previewArea: document.getElementById('preview-area'),
      sidePanel: document.getElementById('side-panel'),
      dropZone: document.getElementById('drop-zone'),
      fileInput: document.getElementById('file-input'),
      btnUpload: document.getElementById('btn-upload'),
      btnEmptyUpload: document.getElementById('empty-upload'),
      btnDownload: document.getElementById('btn-download'),
      btnUndo: document.getElementById('btn-undo'),
      btnRedo: document.getElementById('btn-redo'),
      deviceToggle: document.getElementById('device-toggle'),
      errorBanner: document.getElementById('error-banner'),
      filename: document.getElementById('filename'),
      toastHost: document.getElementById('toast-host'),
      searchInput: document.getElementById('search-input')
    };

    const state = {
      filename: null,
      dirty: false,
      hasDoc: false
    };

    const AUTOSAVE_KEY = 'edit-i-fact:draft';
    const AUTOSAVE_DELAY = 1200;
    let autosaveTimer = null;

    function init() {
      bindFileInput();
      bindDropZone();
      bindToolbar();
      bindShortcuts();
      bindDeviceToggle();
      bindModelSync();
      offerRestore();
    }

    function bindFileInput() {
      els.fileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) await loadFile(file);
        e.target.value = '';
      });
      const open = () => els.fileInput.click();
      els.btnUpload.addEventListener('click', open);
      els.btnEmptyUpload.addEventListener('click', (e) => { e.stopPropagation(); open(); });
      els.dropZone.addEventListener('click', open);
    }

    function bindDropZone() {
      const dz = els.dropZone;
      ['dragenter','dragover'].forEach(ev => {
        dz.addEventListener(ev, (e) => {
          e.preventDefault();
          dz.classList.add('drag-over');
        });
      });
      ['dragleave','drop'].forEach(ev => {
        dz.addEventListener(ev, (e) => {
          e.preventDefault();
          if (ev === 'dragleave' && e.target !== dz) return;
          dz.classList.remove('drag-over');
        });
      });
      dz.addEventListener('drop', async (e) => {
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) await loadFile(file);
      });
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => e.preventDefault());
    }

    function bindToolbar() {
      els.btnDownload.addEventListener('click', download);
      els.btnUndo.addEventListener('click', doUndo);
      els.btnRedo.addEventListener('click', doRedo);

      History.onChange(() => {
        els.btnUndo.disabled = !History.canUndo();
        els.btnRedo.disabled = !History.canRedo();
      });
    }

    function bindShortcuts() {
      document.addEventListener('keydown', (e) => {
        const mod = e.metaKey || e.ctrlKey;
        if (!mod) return;
        const k = e.key.toLowerCase();
        if (k === 's') { e.preventDefault(); if (state.hasDoc) download(); }
        else if (k === 'o') { e.preventDefault(); els.fileInput.click(); }
        else if (k === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
        else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); doRedo(); }
        else if (k === 'f') { e.preventDefault(); els.searchInput.focus(); els.searchInput.select(); }
      });

      window.addEventListener('beforeunload', (e) => {
        if (state.dirty) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    }

    function bindDeviceToggle() {
      els.deviceToggle.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-device]');
        if (!btn) return;
        const mode = btn.dataset.device;
        for (const b of els.deviceToggle.querySelectorAll('button')) {
          const active = b === btn;
          b.classList.toggle('active', active);
          b.setAttribute('aria-selected', active ? 'true' : 'false');
        }
        PreviewFrame.setDevice(mode);
      });
    }

    function bindModelSync() {
      DocModel.onChange(({ kind, id, before, after, origin }) => {
        state.dirty = true;
        els.filename.classList.add('dirty');

        // Mirror change to whichever surface didn't originate the edit.
        if (kind === 'text') {
          if (origin !== 'iframe') PreviewFrame.updateElementText(id, after);
          if (origin !== 'panel') SidePanel.updateItemText(id, after);
        } else if (kind === 'color') {
          PreviewFrame.updateElementStyle(id, 'color', after);
          if (origin !== 'panel') SidePanel.updateItemColor(id, after);
        } else if (kind === 'bgColor') {
          PreviewFrame.updateElementStyle(id, 'background-color', after);
          if (origin !== 'panel') SidePanel.updateItemBgColor(id, after);
        } else if (kind === 'borderColor') {
          PreviewFrame.updateElementStyle(id, 'border-color', after);
          if (origin !== 'panel') SidePanel.updateItemBorderColor(id, after);
        } else if (kind === 'borderRadius') {
          // Always emit the px value, including 0 — falsy check would remove
          // the inline style and the element's CSS class radius would reappear.
          PreviewFrame.updateElementStyle(id, 'border-radius', after + 'px');
          if (origin !== 'panel') SidePanel.updateItemBorderRadius(id, after);
        } else if (kind === 'iconColor') {
          PreviewFrame.updateIconColor(id, after);
          if (origin !== 'panel') SidePanel.updateItemIconColor(id, after);
        } else if (kind === 'padding') {
          PreviewFrame.updateElementStyle(id, 'padding', after + 'px');
          if (origin !== 'panel') SidePanel.updateItemPadding(id, after);
        } else if (kind === 'href') {
          PreviewFrame.updateElementAttr(id, 'href', after);
          if (origin !== 'panel') SidePanel.updateItemHref(id, after);
        } else if (kind === 'fontFamily') {
          PreviewFrame.updateElementStyle(id, 'font-family', after);
          if (origin !== 'panel') SidePanel.updateItemFontFamily(id, after);
        } else if (kind === 'fontSize') {
          PreviewFrame.updateElementStyle(id, 'font-size', after ? (after + 'px') : '');
          if (origin !== 'panel') SidePanel.updateItemFontSize(id, after);
        } else if (kind === 'fontWeight') {
          PreviewFrame.updateElementStyle(id, 'font-weight', after);
          if (origin !== 'panel') SidePanel.updateItemStyle(id, kind, after);
        } else if (kind === 'textAlign') {
          PreviewFrame.updateElementStyle(id, 'text-align', after);
          if (origin !== 'panel') SidePanel.updateItemStyle(id, kind, after);
        } else if (kind === 'lineHeight') {
          PreviewFrame.updateElementStyle(id, 'line-height', after);
          if (origin !== 'panel') SidePanel.updateItemStyle(id, kind, after);
        } else if (kind === 'letterSpacing') {
          PreviewFrame.updateElementStyle(id, 'letter-spacing', after === '' ? '' : after + 'px');
          if (origin !== 'panel') SidePanel.updateItemStyle(id, kind, after);
        } else if (kind === 'opacity') {
          PreviewFrame.updateElementStyle(id, 'opacity', after);
          if (origin !== 'panel') SidePanel.updateItemStyle(id, kind, after);
        } else if (kind === 'borderWidth') {
          PreviewFrame.updateElementStyle(id, 'border-width', after + 'px');
          if (origin !== 'panel') SidePanel.updateItemStyle(id, kind, after);
        } else if (kind === 'borderStyle') {
          PreviewFrame.updateElementStyle(id, 'border-style', after);
          if (origin !== 'panel') SidePanel.updateItemStyle(id, kind, after);
        } else if (kind === 'boxShadow') {
          PreviewFrame.updateElementStyle(id, 'box-shadow', after);
          if (origin !== 'panel') SidePanel.updateItemStyle(id, kind, after);
        } else if (kind === 'delete') {
          PreviewFrame.removeElement(id);
          SidePanel.render();
        } else if (kind === 'restore') {
          PreviewFrame.render(() => {
            SidePanel.render();
            if (id) {
              SidePanel.focusBlock(id);
              PreviewFrame.focusBlock(id);
            }
          });
        } else if (kind === 'move') {
          PreviewFrame.moveElement(id, after);
          SidePanel.render();
          // Bring the moved row back into view with a focus pulse.
          setTimeout(() => SidePanel.focusBlock(id), 0);
        } else if (kind === 'imageSrc') {
          PreviewFrame.updateElementAttr(id, 'src', after);
          if (origin !== 'panel') SidePanel.updateItemImageSrc(id, after);
        } else if (kind === 'imageAlt') {
          PreviewFrame.updateElementAttr(id, 'alt', after);
          if (origin !== 'panel') SidePanel.updateItemImageAlt(id, after);
        }

        // Record history for user-initiated edits, not for history replays.
        // Deletes are now undoable because DocModel passes restore data in `before`.
        if (origin === 'panel' || origin === 'iframe' || origin === 'replace') {
          History.record({ kind, id, before, after });
        }
        scheduleAutosave();
      });
    }

    async function loadFile(file) {
      els.errorBanner.classList.remove('visible');
      try {
        const { name, html } = await FileIO.read(file);
        applyHtml(html, name);
        toast('Loaded ' + name, 'success');
      } catch (err) {
        showError(err.message || 'Failed to load file.');
      }
    }

    function applyHtml(html, filename) {
      DocModel.reset();
      History.reset();
      const result = DocModel.load(html);
      const hasAnything = result && ((result.textCount || 0) > 0 || (result.candidates || 0) > 0);
      if (!hasAnything) {
        const noBody = !DocModel.serialize().includes('<body');
        if (noBody) {
          showError("We couldn't find any content in this file.");
          return;
        }
      }
      state.filename = filename;
      state.dirty = false;
      state.hasDoc = true;
      els.filename.textContent = filename;
      els.filename.classList.add('visible');
      els.filename.classList.remove('dirty');
      els.emptyState.style.display = 'none';
      els.previewArea.classList.add('visible');
      els.sidePanel.classList.add('visible');
      els.btnDownload.disabled = false;
      // Render once after iframe loads, so phase-2 shape/icon detection
      // has populated items before the panel is built (avoids a re-render
      // race if the user starts typing fast).
      PreviewFrame.render((iframeDoc) => {
        DocModel.completeDetection(iframeDoc);
        SidePanel.render();
      });
      hideResumePrompt();
    }

    function download() {
      if (!state.hasDoc) return;
      const html = DocModel.serialize();
      FileIO.download(html, state.filename);
      state.dirty = false;
      els.filename.classList.remove('dirty');
      toast('Downloaded', 'success');
    }

    function applyHistoryOp(op) {
      if (!op) return;
      const opts = { origin: 'history' };
      if (op.kind === 'text') DocModel.setText(op.id, op.value, opts);
      else if (op.kind === 'color') DocModel.setColor(op.id, op.value, opts);
      else if (op.kind === 'bgColor') DocModel.setBgColor(op.id, op.value, opts);
      else if (op.kind === 'borderColor') DocModel.setBorderColor(op.id, op.value, opts);
      else if (op.kind === 'borderRadius') DocModel.setBorderRadius(op.id, op.value, opts);
      else if (op.kind === 'padding') DocModel.setPadding(op.id, op.value, opts);
      else if (op.kind === 'iconColor') DocModel.setIconColor(op.id, op.value, opts);
      else if (op.kind === 'href') DocModel.setHref(op.id, op.value, opts);
      else if (op.kind === 'fontFamily') DocModel.setFontFamily(op.id, op.value, opts);
      else if (op.kind === 'fontSize') DocModel.setFontSize(op.id, op.value, opts);
      else if (op.kind === 'fontWeight') DocModel.setFontWeight(op.id, op.value, opts);
      else if (op.kind === 'textAlign') DocModel.setTextAlign(op.id, op.value, opts);
      else if (op.kind === 'lineHeight') DocModel.setLineHeight(op.id, op.value, opts);
      else if (op.kind === 'letterSpacing') DocModel.setLetterSpacing(op.id, op.value, opts);
      else if (op.kind === 'opacity') DocModel.setOpacity(op.id, op.value, opts);
      else if (op.kind === 'borderWidth') DocModel.setBorderWidth(op.id, op.value, opts);
      else if (op.kind === 'borderStyle') DocModel.setBorderStyle(op.id, op.value, opts);
      else if (op.kind === 'boxShadow') DocModel.setBoxShadow(op.id, op.value, opts);
      else if (op.kind === 'delete') {
        if (op.value && op.value.element) DocModel.restoreItem(op.value, opts);
        else DocModel.deleteItem(op.id, opts);
      }
      else if (op.kind === 'move') DocModel.moveItem(op.id, op.value, opts);
      else if (op.kind === 'imageSrc') DocModel.setImageSrc(op.id, op.value, opts);
      else if (op.kind === 'imageAlt') DocModel.setImageAlt(op.id, op.value, opts);
    }
    function doUndo() { applyHistoryOp(History.undo()); }
    function doRedo() { applyHistoryOp(History.redo()); }

    function notifyFocus(id, source) {
      if (source === 'iframe') SidePanel.focusBlock(id);
      else if (source === 'panel') PreviewFrame.focusBlock(id);
    }

    function showError(msg) {
      els.errorBanner.textContent = msg;
      els.errorBanner.classList.add('visible');
    }

    function toast(msg, kind) {
      const t = document.createElement('div');
      t.className = 'toast' + (kind ? ' ' + kind : '');
      t.textContent = msg;
      els.toastHost.appendChild(t);
      setTimeout(() => {
        t.style.transition = 'opacity 0.2s ease';
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 220);
      }, 1800);
    }

    function scheduleAutosave() {
      clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(() => {
        try {
          const payload = {
            filename: state.filename,
            html: DocModel.serialize(),
            timestamp: Date.now()
          };
          localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(payload));
        } catch (e) { /* quota or storage disabled — ignore silently */ }
      }, AUTOSAVE_DELAY);
    }

    function offerRestore() {
      let raw = null;
      try { raw = localStorage.getItem(AUTOSAVE_KEY); } catch (e) { return; }
      if (!raw) return;
      let data;
      try { data = JSON.parse(raw); } catch (e) { return; }
      if (!data || !data.html) return;

      const age = Date.now() - (data.timestamp || 0);
      if (age > 30 * 24 * 60 * 60 * 1000) { // 30 days
        try { localStorage.removeItem(AUTOSAVE_KEY); } catch (e) {}
        return;
      }

      const prompt = document.createElement('div');
      prompt.className = 'resume-prompt';
      prompt.id = 'resume-prompt';
      prompt.innerHTML =
        '<span>Restore last session — <strong></strong>?</span>' +
        '<button id="resume-yes">Restore</button>' +
        '<button id="resume-no" class="dismiss">Dismiss</button>';
      prompt.querySelector('strong').textContent = data.filename || 'previous draft';
      document.body.appendChild(prompt);

      prompt.querySelector('#resume-yes').addEventListener('click', () => {
        applyHtml(data.html, data.filename || 'restored.html');
        toast('Session restored', 'success');
      });
      prompt.querySelector('#resume-no').addEventListener('click', () => {
        try { localStorage.removeItem(AUTOSAVE_KEY); } catch (e) {}
        hideResumePrompt();
      });
    }

    function hideResumePrompt() {
      const p = document.getElementById('resume-prompt');
      if (p) p.remove();
    }

    return { init, notifyFocus, toast };
  })();

  App.init();
})();
</script>
</body>
</html>
